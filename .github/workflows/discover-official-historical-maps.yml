name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: write

jobs:
  preview-ussr-1990:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compact preview of the official full-USSR sheet
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick >/dev/null
          mkdir -p research-artifacts/atlas1990
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 \
            'https://archive.org/download/antonov_vm_red_atlas_mira_1990/antonov_vm_red_atlas_mira_1990.pdf' \
            -o /tmp/atlas-image.pdf
          pdftoppm -f 4 -l 4 -jpeg -r 55 -singlefile /tmp/atlas-image.pdf /tmp/ussr-preview
          convert /tmp/ussr-preview.jpg -resize '420x420>' -quality 45 /tmp/ussr-preview-small.jpg
          base64 -w0 /tmp/ussr-preview-small.jpg > research-artifacts/atlas1990/page-04-preview.b64
          printf '\n' >> research-artifacts/atlas1990/page-04-preview.b64
          identify /tmp/ussr-preview.jpg /tmp/ussr-preview-small.jpg
          wc -c research-artifacts/atlas1990/page-04-preview.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-artifacts/atlas1990/page-04-preview.b64
          git commit -m 'Research: add compact USSR map preview [skip ci]'
          git push origin HEAD:research/discover-official-historical-maps
