name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: read

jobs:
  resolve-ussr-1928-georef:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Commons originals and inspect Retromap metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,html
          names=[
            'Атлас Союза Советских Социалистических Республик 1928 - карта СССР (NE).jpg',
            'Атлас Союза Советских Социалистических Республик 1928 - карта СССР (NW).jpg',
            'Атлас Союза Советских Социалистических Республик 1928 - карта СССР (SW).jpg',
            'Атлас Союза Советских Социалистических Республик 1928 - карта СССР (SE).jpg',
          ]
          for name in names:
            params={'action':'query','format':'json','prop':'imageinfo','iiprop':'url|size|sha1','titles':'File:'+name}
            url='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={'User-Agent':'HistoryCore/1.0 research'})
            data=json.load(urllib.request.urlopen(req,timeout=45))
            page=next(iter(data['query']['pages'].values())); info=(page.get('imageinfo') or [{}])[0]
            print('COMMONS',name,'=>',json.dumps(info,ensure_ascii=False))
          rurl='https://retromap.ru/14192825_53.88333%2C86.71667'
          req=urllib.request.Request(rurl,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=45).read().decode('utf-8','replace')
          print('RETROMAP_BYTES',len(page))
          for line in page.splitlines():
            low=line.lower()
            if '14192825' in line or ('tile' in low and ('url' in low or 'layer' in low)) or 'bounds' in low or 'control' in low or 'georef' in low:
              print('RETROMAP_LINE',line[:2000])
          for m in re.finditer(r'https?://[^"\'<> ]+',page):
            u=html.unescape(m.group(0))
            if '14192825' in u or 'tile' in u.lower(): print('RETROMAP_URL',u[:1000])
          PY
