name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: read

jobs:
  inspect-ussr-1928:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect the official 1928 USSR atlas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-rus >/dev/null
          mkdir -p /tmp/atlas1928
          curl -fL --retry 3 --connect-timeout 15 --max-time 300 \
            'https://cdn.ruarxive.org/public/saved_istmat/books/39972_1.pdf' \
            -o /tmp/atlas1928/atlas.pdf
          pdfinfo /tmp/atlas1928/atlas.pdf | sed -n '1,30p'
          pages=$(pdfinfo /tmp/atlas1928/atlas.pdf | awk '/^Pages:/ {print $2}')
          echo "PAGES=$pages"
          echo '=== TEXT/OCR CANDIDATE PAGES ==='
          for p in $(seq 1 "$pages"); do
            txt=$(pdftotext -f "$p" -l "$p" -layout /tmp/atlas1928/atlas.pdf - 2>/dev/null || true)
            if printf '%s' "$txt" | grep -Eqi 'Союз Советских|СССР|15 ?000 ?000|15.000.000'; then
              echo "TEXT_PAGE=$p"
              printf '%s\n' "$txt" | head -n 60
            fi
          done
          max=$(( pages < 20 ? pages : 20 ))
          for p in $(seq 1 "$max"); do
            pdftoppm -f "$p" -l "$p" -jpeg -r 100 -singlefile /tmp/atlas1928/atlas.pdf "/tmp/atlas1928/p$(printf '%02d' "$p")" >/dev/null 2>&1
            ocr=$(tesseract "/tmp/atlas1928/p$(printf '%02d' "$p").jpg" stdout -l rus+eng --psm 11 2>/dev/null || true)
            if printf '%s' "$ocr" | grep -Eqi 'СОЮЗ|СОВЕТСК|СССР|15.?000.?000'; then
              echo "OCR_PAGE=$p"
              printf '%s\n' "$ocr" | head -n 100
            fi
          done
