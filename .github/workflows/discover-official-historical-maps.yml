name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: read

jobs:
  inspect-ussr-1928-originals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and inspect exact Commons images linked by Istmat
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil tesseract-ocr tesseract-ocr-rus >/dev/null
          mkdir -p /tmp/ussr1928
          python - <<'PY'
          import urllib.request,re,html,os,json
          from PIL import Image
          base='https://www.istmat.org/node/39983'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          links=[]
          for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',page,re.I|re.S):
            href=html.unescape(m.group(1)); text=' '.join(re.sub('<[^>]+>',' ',m.group(2)).split())
            if 'commons.wikimedia.org/wiki/File:' in href and re.search(r'СССР\s+(северо-восток|северо-запад|юго-запад|юго-восток)',text,re.I):
              links.append((text,href.replace('http://','https://')))
          print('QUADRANT_LINK_COUNT',len(links))
          print('QUADRANT_LINKS',json.dumps(links,ensure_ascii=False,indent=2))
          mapping={
            'северо-восток':'NE','северо-запад':'NW','юго-запад':'SW','юго-восток':'SE'
          }
          for text,href in links:
            tag=next(v for k,v in mapping.items() if k in text.lower())
            req=urllib.request.Request(href,headers={'User-Agent':'Mozilla/5.0'})
            html_page=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
            candidates=[]
            for pat in [r'<a[^>]+class="internal"[^>]+href="([^"]+)"',r'<meta[^>]+property="og:image"[^>]+content="([^"]+)"']:
              mm=re.search(pat,html_page,re.I)
              if mm: candidates.append(html.unescape(mm.group(1)))
            print('PAGE',tag,'CANDIDATES',candidates[:4])
            if not candidates: raise SystemExit(f'No downloadable image found for {tag}')
            image_url=candidates[0]
            if image_url.startswith('//'): image_url='https:'+image_url
            elif image_url.startswith('/'): image_url='https://commons.wikimedia.org'+image_url
            out=f'/tmp/ussr1928/{tag}.jpg'
            req=urllib.request.Request(image_url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=180) as r, open(out,'wb') as f: f.write(r.read())
            im=Image.open(out)
            print('IMAGE',tag,'URL',image_url,'SIZE',im.size,'MODE',im.mode,'BYTES',os.path.getsize(out))
            # Preserve a reviewable 1600 px diagnostic without mutating the source image.
            p=im.copy(); p.thumbnail((1600,1600)); p.save(f'/tmp/ussr1928/{tag}-preview.jpg',quality=90)
          PY
          for q in NW NE SW SE; do
            echo "=== OCR $q ==="
            tesseract "/tmp/ussr1928/$q.jpg" stdout -l rus+eng --psm 11 2>/dev/null | grep -E 'СССР|СОЮЗ|СОВЕТ|МАСШТАБ|[0-9]{1,3}[°º]' | head -n 100 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-1928-quadrant-previews
          path: /tmp/ussr1928/*-preview.jpg
          retention-days: 7
