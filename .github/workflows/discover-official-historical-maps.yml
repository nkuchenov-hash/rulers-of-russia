name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: read

jobs:
  resolve-ussr-1928-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Istmat attachment URLs and inspect map candidates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html
          url='https://www.istmat.org/node/39972'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
          print('PAGE_BYTES',len(page))
          for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',page,re.I|re.S):
            href=html.unescape(m.group(1)); text=re.sub('<[^>]+>',' ',m.group(2)); text=' '.join(html.unescape(text).split())
            if 'pdf' in href.lower() or 'Союз Советских' in text or 'Карта мира' in text or 'Российская Социалистическая' in text:
              print('LINK',text,'=>',href)
          PY
