name: Discover official historical maps

on:
  push:
    branches:
      - research/discover-official-historical-maps

permissions:
  contents: read

jobs:
  inspect-ussr-1990:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect official 1990 GUGK atlas
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null
          mkdir -p atlas1990
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            'https://archive.org/download/antonov_vm_red_atlas_mira_1990/antonov_vm_red_atlas_mira_1990_text.pdf' \
            -o atlas1990/atlas-text.pdf
          curl -fL --retry 3 --connect-timeout 15 --max-time 240 \
            'https://archive.org/download/antonov_vm_red_atlas_mira_1990/antonov_vm_red_atlas_mira_1990.pdf' \
            -o atlas1990/atlas-image.pdf
          pdfinfo atlas1990/atlas-image.pdf | sed -n '1,30p'
          pages=$(pdfinfo atlas1990/atlas-text.pdf | awk '/^Pages:/ {print $2}')
          echo "TEXT_PAGES=$pages"
          for p in $(seq 1 "$pages"); do
            text=$(pdftotext -f "$p" -l "$p" -layout atlas1990/atlas-text.pdf - 2>/dev/null || true)
            if printf '%s' "$text" | grep -Eqi 'Союз Советских|СССР|Union of Soviet'; then
              echo "===== CANDIDATE PAGE $p ====="
              printf '%s\n' "$text" | head -n 80
            fi
          done
          pdftoppm -f 1 -l 20 -jpeg -r 80 atlas1990/atlas-image.pdf atlas1990/page >/dev/null 2>&1 || true
          ls -lh atlas1990 | head -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-1990-inspection
          path: |
            atlas1990/page-*.jpg
          retention-days: 1
          if-no-files-found: warn
