name: Apply History Core boundary track UI patch

on:
  push:
    paths:
      - 'scripts/patch-boundary-track-ui.py'
      - 'scripts/trigger-boundary-track-ui.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply boundary track UI patch
        run: python scripts/patch-boundary-track-ui.py
      - name: Commit renderer changes
        run: |
          if git diff --quiet; then
            echo "No renderer changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          git commit -m "Distinguish state border and maritime jurisdiction"
          git push origin HEAD:main
