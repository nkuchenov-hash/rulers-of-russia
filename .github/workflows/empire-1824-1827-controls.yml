name: Empire 1824 1827 controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1824-1827.mjs
      - .github/workflows/empire-1824-1827-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1824-1827.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1824-1827-controls
          path: empire-1824-1827-controls.json
