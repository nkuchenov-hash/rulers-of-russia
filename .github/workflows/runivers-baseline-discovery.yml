name: Runivers baseline discovery

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/discover-runivers-baseline.mjs'
      - '.github/workflows/runivers-baseline-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Discover Runivers NextGIS resources
        id: discover
        continue-on-error: true
        run: node scripts/discover-runivers-baseline.mjs
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runivers-baseline-discovery
          path: tmp/runivers-discovery
          if-no-files-found: warn
      - name: Require successful discovery
        if: steps.discover.outcome != 'success'
        run: |
          echo 'Runivers baseline discovery failed; geometric regression certification cannot be completed.' >&2
          exit 1
