name: Runivers geometric regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/data/history-core/**'
      - 'scripts/discover-runivers-baseline.mjs'
      - 'scripts/select-runivers-current-baseline.mjs'
      - 'scripts/validate-runivers-regression.mjs'
      - '.github/workflows/runivers-baseline-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover Runivers NextGIS reference layers
        id: discover
        continue-on-error: true
        run: node scripts/discover-runivers-baseline.mjs

      - name: Pin current Runivers polygon baseline
        if: steps.discover.outcome == 'success'
        id: baseline
        continue-on-error: true
        run: node scripts/select-runivers-current-baseline.mjs

      - name: Install project dependencies
        if: steps.discover.outcome == 'success' && steps.baseline.outcome == 'success'
        run: npm install

      - name: Materialize canonical History Core
        if: steps.discover.outcome == 'success' && steps.baseline.outcome == 'success'
        run: npm run materialize:history

      - name: Validate Runivers geometric regression
        if: steps.discover.outcome == 'success' && steps.baseline.outcome == 'success'
        id: regression
        continue-on-error: true
        env:
          RUNIVERS_DISCOVERY_FILE: tmp/runivers-discovery/runivers-current-baseline.json
        run: node scripts/validate-runivers-regression.mjs

      - name: Upload Runivers audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runivers-geometric-regression
          path: |
            tmp/runivers-discovery
            tmp/runivers-regression
          if-no-files-found: warn

      - name: Require Runivers discovery
        if: steps.discover.outcome != 'success'
        run: |
          echo 'Runivers baseline discovery failed; historical map completion cannot be certified.' >&2
          exit 1

      - name: Require current baseline selection
        if: steps.discover.outcome == 'success' && steps.baseline.outcome != 'success'
        run: |
          echo 'Current Runivers polygon baseline could not be pinned unambiguously.' >&2
          exit 1

      - name: Require geometric regression acceptance
        if: steps.discover.outcome == 'success' && steps.baseline.outcome == 'success' && steps.regression.outcome != 'success'
        run: |
          echo 'Runivers geometric regression failed. Resolve the contour regression or add an A1/A2/A3 evidence-backed override.' >&2
          exit 1
