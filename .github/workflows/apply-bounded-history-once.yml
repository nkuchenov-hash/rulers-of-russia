name: Apply bounded historical snapshot validity once
on:
  push:
    branches: [history/runivers-medieval-bases]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history/runivers-medieval-bases
      - name: Apply bounded validity and medieval semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new):
              p=Path(path); text=p.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected block in {path}: {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          # Materialized snapshots carry an explicit upper validity bound.
          replace('scripts/materialize-history-territory.mjs',
            "    coverageAnchorMonth: state.coverageAnchorMonth ?? null,\n    track: state.track,",
            "    coverageAnchorMonth: state.coverageAnchorMonth ?? null,\n    validThroughMonth: state.validThroughMonth ?? null,\n    track: state.track,")
          replace('scripts/materialize-history-territory.mjs',
            "      coverageAnchorMonth: base.coverageAnchorMonth ?? null,\n      dateKey: entry.dateKey,",
            "      coverageAnchorMonth: base.coverageAnchorMonth ?? null,\n      validThroughMonth: base.validThroughMonth ?? null,\n      dateKey: entry.dateKey,")
          replace('scripts/materialize-history-territory.mjs',
            "  const action = inferAction(change);\n  const ids = change.geometryFragmentIds ?? [];",
            "  const changeMonth = entry.dateKey.slice(0, 7);\n  if (state.validThroughMonth && changeMonth > state.validThroughMonth) {\n    warnings.push(`Change ${change.id} skipped: active base for ${stateKey} expires at ${state.validThroughMonth}`);\n    continue;\n  }\n\n  const action = inferAction(change);\n  const ids = change.geometryFragmentIds ?? [];")

          # Month selection uses the latest started snapshot only; once that snapshot expires,
          # an older state is never resurrected behind it.
          replace('scripts/build-history-month-index.mjs',
            "  const dateKey = normalizedSnapshotKey(snapshot);\n  if (!dateKey) continue;\n  const key = `${snapshot.polityId}::${snapshot.track}`;\n  const list = verifiedByPolityTrack.get(key) ?? [];\n  list.push({...snapshot, __dateKey: dateKey});",
            "  const dateKey = normalizedSnapshotKey(snapshot);\n  if (!dateKey) continue;\n  const validFromMonth = snapshot.coverageAnchorMonth ?? dateKey.slice(0, 7);\n  const validThroughMonth = snapshot.validThroughMonth ?? null;\n  const key = `${snapshot.polityId}::${snapshot.track}`;\n  const list = verifiedByPolityTrack.get(key) ?? [];\n  list.push({...snapshot, __dateKey: dateKey, __validFromMonth: validFromMonth, __validThroughMonth: validThroughMonth});")
          replace('scripts/build-history-month-index.mjs',
            "for (const list of verifiedByPolityTrack.values()) list.sort((a, b) => a.__dateKey.localeCompare(b.__dateKey));",
            "for (const list of verifiedByPolityTrack.values()) list.sort((a, b) => a.__validFromMonth.localeCompare(b.__validFromMonth) || a.__dateKey.localeCompare(b.__dateKey));")
          replace('scripts/build-history-month-index.mjs',
            "  const end = monthEndKey(cursor);\n  let chosen = null;\n  for (const candidate of candidates) {\n    if (candidate.__dateKey <= end) chosen = candidate;\n    else break;\n  }",
            "  let latestStarted = null;\n  for (const candidate of candidates) {\n    if (candidate.__validFromMonth <= cursor) latestStarted = candidate;\n    else break;\n  }\n  const chosen = latestStarted && (!latestStarted.__validThroughMonth || cursor <= latestStarted.__validThroughMonth)\n    ? latestStarted\n    : null;")
          replace('scripts/build-history-month-index.mjs',
            "      effectiveDate: chosen.effectiveDate?.normalized ?? null,\n      derivedFromChangeIds: chosen.derivedFromChangeIds ?? [],",
            "      effectiveDate: chosen.effectiveDate?.normalized ?? null,\n      historicalDate: chosen.historicalDate ?? null,\n      validThroughMonth: chosen.validThroughMonth ?? null,\n      derivedFromChangeIds: chosen.derivedFromChangeIds ?? [],")
          replace('scripts/build-history-month-index.mjs',
            "  resolutionRule: 'Use latest geometry-verified History Core state at month end; otherwise materialize an unambiguous, explicitly provisional state from the dated bootstrap archive. A later-dated proxy is permitted only when the coverage period explicitly opts in via allowForwardProxy and remains visibly non-canonical.',",
            "  resolutionRule: 'Use the latest-started geometry-verified History Core state only while that snapshot remains within its explicit validity interval; never resurrect an older verified state after a later bounded snapshot expires. Otherwise materialize an explicitly provisional dated bootstrap state. A later-dated proxy is permitted only when the coverage period explicitly opts in and remains visibly non-canonical.',")

          # Validator enforces validThroughMonth and its ordering against the operational start.
          replace('scripts/validate-history-core.mjs',
            "  if (!Array.isArray(base.geometryFragmentIds) || base.geometryFragmentIds.length === 0) fail(`${label} has no geometryFragmentIds`);",
            "  const baseStartMonth = base.coverageAnchorMonth ?? (/^\\d{4}-\\d{2}/.test(base.effectiveDate?.normalized ?? '') ? base.effectiveDate.normalized.slice(0, 7) : null);\n  if (base.validThroughMonth !== undefined) {\n    if (!/^\\d{4}-\\d{2}$/.test(base.validThroughMonth ?? '')) fail(`${label} has invalid validThroughMonth; expected YYYY-MM`);\n    const throughMonth = Number(String(base.validThroughMonth).slice(5, 7));\n    if (throughMonth < 1 || throughMonth > 12) fail(`${label} has invalid valid-through month`);\n    if (baseStartMonth && base.validThroughMonth < baseStartMonth) fail(`${label} validThroughMonth precedes its operational start month`);\n  }\n  if (!Array.isArray(base.geometryFragmentIds) || base.geometryFragmentIds.length === 0) fail(`${label} has no geometryFragmentIds`);")

          # Bound the existing Tornau/Rurik source to the period actually named in its legend.
          model_path=Path('public/data/history-core/territory-model.json')
          model=json.loads(model_path.read_text())
          base=next(x for x in model['baseStates'] if x['id']=='base-early-rus-rurik-circa-862')
          base['validThroughMonth']='0879-12'
          base['notes']='coverageAnchorMonth starts the dataset at 0862-01 without inventing a January historical date. The Tornau legend explicitly labels this reconstruction «Владения Рюрика 862–879», so verified use ends at 0879-12; 880–881 remains provisional until separately sourced.'
          model_path.write_text(json.dumps(model,ensure_ascii=False,indent=2)+'\n')

          # Correct medieval coverage semantics: political-control reconstruction, not legal state-border linework.
          coverage_path=Path('public/data/history-core/coverage-periods.json')
          coverage=json.loads(coverage_path.read_text())
          for pid in ['coverage-0882-1124-kievan-rus','coverage-1125-1262-vladimir-rus']:
              p=next(x for x in coverage['periods'] if x['id']==pid)
              p['track']='de-facto-control'
              p['territorialModel']='mixed'
              p['notes']='Primary monthly surface is reconstructed political/de-facto control with frontier and tributary uncertainty, not a surveyed modern-style legal border. Where a treaty or demarcation provides an actual line, it must be represented separately as a dated boundary fragment.'
          coverage_path.write_text(json.dumps(coverage,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add scripts/materialize-history-territory.mjs scripts/build-history-month-index.mjs scripts/validate-history-core.mjs public/data/history-core/territory-model.json public/data/history-core/coverage-periods.json
          if git diff --cached --quiet; then
            echo 'Bounded validity migration already applied.'
            exit 0
          fi
          git commit -m 'Bound historical territory snapshot validity'
          git push origin HEAD:history/runivers-medieval-bases
