name: Audit post 138
on:
  push:
    branches: [research/audit-post-138]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source-verified classification inventory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root='public/data/history-core';
          const model=JSON.parse(fs.readFileSync(path.join(root,'territory-model.json'),'utf8'));
          const rows=[];
          for (const rel of model.changeFiles ?? []) {
            const data=JSON.parse(fs.readFileSync(path.join(root,rel),'utf8'));
            for (const c of data.territoryChanges ?? []) {
              if(c.reviewStatus!=='source-verified' || c.geometryAction==='metadata-only') continue;
              rows.push({id:c.id,file:rel,eventId:c.eventId,polityId:c.polityId,track:c.track,territorialModel:c.territorialModel,operation:c.operation,geometryAction:c.geometryAction??null,geometryMethod:c.geometry?.method??null,derivationNote:c.geometry?.derivationNote??null,fragmentIds:c.geometryFragmentIds??[],evidenceDocumentIds:c.evidenceDocumentIds??[],notes:c.notes??null});
            }
          }
          console.log('UNCLASSIFIED_SOURCE_VERIFIED_DETAIL');
          console.log(JSON.stringify(rows,null,2));
          const groups={};
          for(const r of rows){const k=`${r.track}|${r.operation}|${r.geometryMethod}`;(groups[k]??=[]).push(r.id)}
          console.log('UNCLASSIFIED_GROUPS');
          console.log(JSON.stringify(groups,null,2));
          NODE
