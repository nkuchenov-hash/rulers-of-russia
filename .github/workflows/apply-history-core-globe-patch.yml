name: Apply History Core globe patch

on:
  push:
    paths:
      - 'scripts/apply-history-core-globe-patch.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply History Core globe patch
        run: node scripts/apply-history-core-globe-patch.mjs
      - name: Commit patched renderer
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx src/app/territory/territory-webgl.module.css scripts/territory-browser-smoke.mjs
          git commit -m 'Connect territory globe to monthly History Core'
          git push origin HEAD:main
