name: Empire milestone controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-milestones.mjs
      - .github/workflows/empire-milestone-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-milestones.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-milestone-controls
          path: empire-milestone-controls.json
