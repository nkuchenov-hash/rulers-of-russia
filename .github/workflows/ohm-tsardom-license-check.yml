name: OHM Tsardom relation license check
on:
  pull_request:
    paths:
      - scripts/check-ohm-tsardom-relation.mjs
      - .github/workflows/ohm-tsardom-license-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-ohm-tsardom-relation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ohm-tsardom-relation-2851290
          path: ohm-tsardom-2851290.json
