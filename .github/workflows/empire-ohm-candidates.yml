name: Empire OHM candidate enumeration
on:
  pull_request:
    paths:
      - scripts/analyze-empire-ohm-candidates.mjs
      - .github/workflows/empire-ohm-candidates.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-ohm-candidates.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-ohm-candidates
          path: empire-ohm-candidates.json
