name: Apply territory V25 clean relief renderer

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-territory-v25-relief.yml
      - scripts/apply-territory-v25.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and verify V25 patch
        run: python scripts/apply-territory-v25.py

      - name: Commit clean relief renderer
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'V25 clean relief renderer already applied.'
            exit 0
          fi
          git commit -m 'Replace satellite map with progressive Natural Earth relief'
          git push
