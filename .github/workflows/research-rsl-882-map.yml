name: Research RSL early Rus map
on:
  push:
    branches: [research/rsl-882-map]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rsl-882-map
      - name: Resolve RSL viewer API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research-artifacts/rsl-882
          python - <<'PY'
          import re,json,urllib.request,urllib.parse
          from pathlib import Path
          origin='https://search.rsl.ru'
          def text(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 history-research'})
              return urllib.request.urlopen(req,timeout=60).read().decode('utf8','ignore')
          js=text(origin+'/js/action-record.js?v=1787651650')
          patterns=[]
          for m in re.finditer(r'.{0,260}(?:online|digital|viewer|read|fulltext|full-text|image|scan|aleph|nrr).{0,520}',js,re.I|re.S):
              patterns.append(re.sub(r'\s+',' ',m.group(0))[:800])
              if len(patterns)>=250: break
          records=[]
          for rec in ['01009494305','01005496028']:
              html=text(origin+'/ru/record/'+rec)
              attrs=[]
              for m in re.finditer(r'<[^>]{0,1200}(?:online|digital|read|fulltext|viewer|image)[^>]{0,1200}>',html,re.I|re.S):
                  attrs.append(re.sub(r'\s+',' ',m.group(0))[:1500])
              # Preserve record-specific JS/data values likely consumed by action-record.js.
              ids=[]
              for m in re.finditer(r'.{0,160}(?:aleph|sysno|recordId|record-id|digital|online|nrr|viewer).{0,300}',html,re.I|re.S):
                  ids.append(re.sub(r'\s+',' ',m.group(0))[:500])
                  if len(ids)>=150: break
              records.append({'record':rec,'tagMatches':attrs[:100],'idSnippets':ids})
          out={'actionRecordJsMatches':patterns,'records':records}
          Path('research-artifacts/rsl-882/viewer-api.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research-artifacts/rsl-882/viewer-api.json
          git commit -m 'Capture RSL online viewer API research' || exit 0
          git push origin HEAD:research/rsl-882-map
