name: Research Tornau early Rus layers
on:
  push:
    branches: [research/rsl-882-map]
permissions:
  contents: write
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rsl-882-map
      - name: Locate southern labels for GCPs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus >/dev/null
          python -m pip install pillow >/dev/null
          python - <<'PY'
          import urllib.request,hashlib,json,subprocess,csv,io
          from pathlib import Path
          from PIL import Image,ImageEnhance,ImageFilter
          url="https://upload.wikimedia.org/wikipedia/commons/8/8d/Historical_map_of_Rus%27%2C_862.gif"
          data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'rulers-history-research/1.0'}),timeout=60).read()
          im=Image.open(io.BytesIO(data)).convert('L')
          # Focus only on the lower half of map no.2 where current triangulation is sparse.
          box=(160,1680,650,1940)
          c=im.crop(box).resize(((box[2]-box[0])*3,(box[3]-box[1])*3))
          c=ImageEnhance.Contrast(c).enhance(2.2).filter(ImageFilter.SHARPEN)
          c.save('/tmp/south.png')
          subprocess.run(['tesseract','/tmp/south.png','/tmp/ocr','-l','rus','--psm','11','tsv'],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          rows=[]
          with open('/tmp/ocr.tsv',encoding='utf8') as f:
              for r in csv.DictReader(f,delimiter='\t'):
                  txt=(r.get('text') or '').strip(); conf=float(r.get('conf') or -1)
                  if txt and conf>=20:
                      left=int(r['left']); top=int(r['top']); w=int(r['width']); h=int(r['height'])
                      rows.append({'text':txt,'confidence':conf,'pixelCenter':[round(box[0]+(left+w/2)/3,1),round(box[1]+(top+h/2)/3,1)]})
          out={'source':url,'sha256':hashlib.sha256(data).hexdigest(),'crop':box,'words':rows}
          Path('research-artifacts/tornau-south-labels.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research-artifacts/tornau-south-labels.json
          git commit -m 'Capture Tornau southern label anchors' || exit 0
          git push origin HEAD:research/rsl-882-map
