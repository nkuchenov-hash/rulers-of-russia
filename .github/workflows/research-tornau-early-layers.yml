name: Research Tornau early Rus layers
on:
  push:
    branches: [research/rsl-882-map]
permissions:
  contents: write
jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/rsl-882-map
      - name: Extract saturated yellow political components
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install pillow opencv-python-headless numpy >/dev/null
          python - <<'PY'
          import urllib.request,hashlib,json,colorsys
          from pathlib import Path
          import numpy as np, cv2
          from PIL import Image
          url="https://upload.wikimedia.org/wikipedia/commons/8/8d/Historical_map_of_Rus%27%2C_862.gif"
          data=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'rulers-history-research/1.0'}),timeout=60).read()
          im=np.array(Image.open(__import__('io').BytesIO(data)).convert('RGB'))
          x0,y0,x1,y1=150,1400,760,1960
          crop=im[y0:y1,x0:x1]
          hsv=cv2.cvtColor(crop,cv2.COLOR_RGB2HSV)
          # OpenCV hue 0..179. Bright saturated yellow: roughly 40..70 degrees.
          mask=cv2.inRange(hsv,np.array([20,115,180],np.uint8),np.array([36,255,255],np.uint8))
          # Close printed labels/rivers and remove tiny scan speckles without changing large contours materially.
          mask=cv2.morphologyEx(mask,cv2.MORPH_CLOSE,np.ones((5,5),np.uint8),iterations=2)
          mask=cv2.morphologyEx(mask,cv2.MORPH_OPEN,np.ones((3,3),np.uint8),iterations=1)
          contours,_=cv2.findContours(mask,cv2.RETR_EXTERNAL,cv2.CHAIN_APPROX_SIMPLE)
          comps=[]
          for c in contours:
              area=float(cv2.contourArea(c))
              if area<120: continue
              eps=max(1.5,0.003*cv2.arcLength(c,True))
              simp=cv2.approxPolyDP(c,eps,True).reshape(-1,2)
              bx,by,bw,bh=cv2.boundingRect(c)
              comps.append({'area':round(area,1),'bbox':[int(bx+x0),int(by+y0),int(bx+bw-1+x0),int(by+bh-1+y0)],
                            'ring':[[int(px+x0),int(py+y0)] for px,py in simp]})
          comps.sort(key=lambda c:c['area'],reverse=True)
          out={'source':url,'sha256':hashlib.sha256(data).hexdigest(),'threshold':'HSV hue 40-72deg, saturation>=115/255, value>=180/255; close5x5x2 open3x3',
               'crop':[x0,y0,x1,y1],'componentCount':len(comps),'components':comps[:40]}
          Path('research-artifacts/tornau-yellow-components.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research-artifacts/tornau-yellow-components.json
          git commit -m 'Capture Tornau yellow layer components' || exit 0
          git push origin HEAD:research/rsl-882-map
