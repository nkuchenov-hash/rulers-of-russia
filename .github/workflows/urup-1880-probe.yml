name: Urup 1880 geometry probe
on:
  pull_request:
    paths:
      - scripts/probe-urup-1880.mjs
      - .github/workflows/urup-1880-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe-urup-1880.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: urup-1880-probe
          path: urup-1880-probe.json
