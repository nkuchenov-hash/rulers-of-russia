name: Empire 1727-1735 candidate research
on:
  push:
    paths:
      - 'scripts/analyze-empire-1727-1735.mjs'
      - '.github/workflows/empire-1727-1735.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1727-1735.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1727-1735-candidates
          path: empire-1727-1735-candidates.json
