name: Audit source-verified spatial semantics
on:
  push:
    branches: [research/audit-after-141]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print unclassified source-verified change semantics
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const root='public/data/history-core';
          const model=JSON.parse(fs.readFileSync(path.join(root,'territory-model.json'),'utf8'));
          for(const rel of model.changeFiles??[]){
            const data=JSON.parse(fs.readFileSync(path.join(root,rel),'utf8'));
            for(const c of data.territoryChanges??[]){
              if(c.reviewStatus==='source-verified' && c.geometryAction!=='metadata-only'){
                console.log(JSON.stringify({
                  id:c.id,file:rel,polityId:c.polityId,track:c.track,operation:c.operation,
                  effectiveDate:c.effectiveDate,territorialModel:c.territorialModel,
                  geometryAction:c.geometryAction??null,geometryMethod:c.geometry?.method??null,
                  geometryFragmentIds:c.geometryFragmentIds??[],notes:c.notes??null,
                  derivationNote:c.geometry?.derivationNote??null
                }));
              }
            }
          }
          NODE
