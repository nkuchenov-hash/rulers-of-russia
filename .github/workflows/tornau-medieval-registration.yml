name: Tornau medieval registration research

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/analyze-tornau-medieval-registration.py
      - scripts/audit-tornau-medieval-independent-gcps.py
      - scripts/analyze-grand-moscow-archive-controls.py
      - scripts/capture-tornau-medieval-diagnostics.py
      - public/data/history-core/research/tornau-medieval-independent-gcps.json
      - public/data/history-core/raster-geometry-recipes/**
      - .github/workflows/tornau-medieval-registration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image registration dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless

      - name: Analyze Tornau medieval raster registration
        run: python scripts/analyze-tornau-medieval-registration.py

      - name: Audit independent target-sheet GCPs
        run: python scripts/audit-tornau-medieval-independent-gcps.py

      - name: Analyze Grand Moscow archive controls
        run: python scripts/analyze-grand-moscow-archive-controls.py

      - name: Capture diagnostic rasters
        run: python scripts/capture-tornau-medieval-diagnostics.py

      - name: Upload registration report
        uses: actions/upload-artifact@v4
        with:
          name: tornau-medieval-registration-report
          path: tornau-medieval-registration-report.json
          if-no-files-found: error

      - name: Upload independent GCP audit
        uses: actions/upload-artifact@v4
        with:
          name: tornau-medieval-independent-gcp-audit
          path: tornau-medieval-independent-gcp-audit.json
          if-no-files-found: error

      - name: Upload Grand Moscow control report
        uses: actions/upload-artifact@v4
        with:
          name: grand-moscow-archive-controls-report
          path: grand-moscow-archive-controls-report.json
          if-no-files-found: error

      - name: Upload diagnostic rasters
        uses: actions/upload-artifact@v4
        with:
          name: tornau-medieval-diagnostic-rasters
          path: tornau-medieval-diagnostics/*.png
          if-no-files-found: error
