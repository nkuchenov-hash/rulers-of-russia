name: Tsardom world snapshot probe
on:
  pull_request:
    paths:
      - scripts/probe-tsardom-world-snapshots.mjs
      - .github/workflows/tsardom-world-snapshot-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe-tsardom-world-snapshots.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tsardom-world-snapshot-probe
          path: tsardom-world-snapshot-probe.json
