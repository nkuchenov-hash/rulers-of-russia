name: Tornau vs OHM Tsardom research

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/compare-tsardom-ohm-to-tornau.py
      - .github/workflows/tornau-ohm-tsardom-research.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Capture pinned Tornau raster
        run: python scripts/capture-tornau-tsardom-1598-1682.py
      - name: Compare archived vectors to Tornau 1682 boundary
        run: python scripts/compare-tsardom-ohm-to-tornau.py
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: tornau-ohm-tsardom-comparison
          path: tornau-tsardom-1598-1682-diagnostics/
          if-no-files-found: error
