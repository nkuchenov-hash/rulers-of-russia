name: Apply territory V22 renderer patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-territory-v22-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch high-resolution terrain and city visibility
        shell: python
        run: |
          from pathlib import Path

          sync = Path('scripts/sync-historical-world.mjs')
          s = sync.read_text()
          old = "const TERRAIN_SURFACE_8K_URL = 'https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/flat_earth_Largest_still.0330.jpg';"
          new = old + "\nconst TERRAIN_SURFACE_21K_URL = 'https://assets.science.nasa.gov/content/dam/science/esd/eo/images/bmng/bmng-topography/july/world.topo.200407.3x21600x10800.jpg';"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  const terrainSurface8kPath = path.join(TERRAIN_ROOT, 'earth_surface_8192.jpg');"
          new = old + "\n  const terrainSurface21kPath = path.join(TERRAIN_ROOT, 'earth_surface_21600.jpg');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    ensureBytes(terrainSurface8kPath, TERRAIN_SURFACE_8K_URL),"
          new = old + "\n    ensureBytes(terrainSurface21kPath, TERRAIN_SURFACE_21K_URL),"
          assert old in s
          s = s.replace(old, new, 1)
          sync.write_text(s)

          src = Path('src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx')
          t = src.read_text()
          t = t.replace('const CAPITAL_DISTANCE=1.16;', 'const CAPITAL_DISTANCE=1.105;', 1)
          t = t.replace('const CITY_DISTANCE=1.075;', 'const CITY_DISTANCE=1.055;', 1)

          old = "const geometry=new THREE.SphereGeometry(1,compact?128:192,compact?80:128),baseMaterial=new THREE.MeshStandardMaterial({color:0xd5d1c8,roughness:.94,metalness:0,emissive:0x242a27,emissiveIntensity:.18}),globe=new THREE.Mesh(geometry,baseMaterial);scene.add(globe);"
          new = "const geometry=new THREE.SphereGeometry(1,compact?128:224,compact?80:144),baseMaterial=new THREE.MeshStandardMaterial({color:0xd5d1c8,roughness:.94,metalness:0,emissive:0x242a27,emissiveIntensity:.18}),globe=new THREE.Mesh(geometry,baseMaterial);baseMaterial.onBeforeCompile=shader=>{shader.fragmentShader=shader.fragmentShader.replace('#include <map_fragment>',`#include <map_fragment>\\nfloat terrainLuma=dot(diffuseColor.rgb,vec3(0.299,0.587,0.114));\\nvec3 terrainMono=vec3(terrainLuma*1.035,terrainLuma,terrainLuma*0.93);\\ndiffuseColor.rgb=clamp((terrainMono-0.5)*1.18+0.5,0.0,1.0);`)};baseMaterial.customProgramCacheKey=()=>\"terrain-v22-monochrome\";scene.add(globe);"
          assert old in t
          t = t.replace(old, new, 1)

          old = "const loader=new THREE.TextureLoader();const base=process.env.NEXT_PUBLIC_BASE_PATH??'';\n    const applySurface=(raw,maxWidth)=>{const t=monochromeTexture(raw,renderer,maxWidth);const old=baseMaterial.map;baseMaterial.map=t;baseMaterial.needsUpdate=true;if(old&&old!==t)old.dispose();renderRef.current()};\n    loader.load(`${base}/data/territory/terrain/earth_surface_2048.jpg`,raw=>applySurface(raw,2048));\n    loader.load(`${base}/data/territory/terrain/earth_surface_8192.jpg`,raw=>applySurface(raw,compact?4096:8192),undefined,()=>{});"
          new = "const loader=new THREE.TextureLoader();const base=process.env.NEXT_PUBLIC_BASE_PATH??'';let closeSurfaceStarted=false;\n    const applySurface=raw=>{raw.colorSpace=THREE.SRGBColorSpace;raw.minFilter=THREE.LinearMipmapLinearFilter;raw.magFilter=THREE.LinearFilter;raw.generateMipmaps=true;raw.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());const old=baseMaterial.map;baseMaterial.map=raw;baseMaterial.needsUpdate=true;if(old&&old!==raw)old.dispose();renderRef.current()};\n    const loadCloseSurface=async()=>{if(closeSurfaceStarted||compact||typeof createImageBitmap!=='function')return;closeSurfaceStarted=true;try{const response=await fetch(`${base}/data/territory/terrain/earth_surface_21600.jpg`,{cache:'force-cache'});if(!response.ok)throw new Error(`terrain ${response.status}`);const blob=await response.blob();const maxGpu=renderer.capabilities.maxTextureSize||8192,targetW=Math.min(12288,maxGpu),targetH=Math.round(targetW/2);if(targetW<=8192)return;const bitmap=await createImageBitmap(blob,{resizeWidth:targetW,resizeHeight:targetH,resizeQuality:'high'});const tex=new THREE.Texture(bitmap);tex.colorSpace=THREE.SRGBColorSpace;tex.minFilter=THREE.LinearMipmapLinearFilter;tex.magFilter=THREE.LinearFilter;tex.generateMipmaps=true;tex.anisotropy=Math.min(16,renderer.capabilities.getMaxAnisotropy());tex.needsUpdate=true;const old=baseMaterial.map;baseMaterial.map=tex;baseMaterial.needsUpdate=true;if(old&&old!==tex)old.dispose();renderRef.current()}catch(error){console.warn('High-resolution terrain texture failed',error);closeSurfaceStarted=false}};\n    loader.load(`${base}/data/territory/terrain/earth_surface_2048.jpg`,applySurface);\n    loader.load(`${base}/data/territory/terrain/earth_surface_8192.jpg`,applySurface,undefined,()=>{});"
          assert old in t
          t = t.replace(old, new, 1)

          old = "const borderGroup=new THREE.Group(),riverGroup=new THREE.Group(),countryGroup=new THREE.Group(),cityGroup=new THREE.Group();scene.add(borderGroup,riverGroup,countryGroup,cityGroup);borderRef.current=borderGroup;riverRef.current=riverGroup;countryLabelsRef.current=countryGroup;cityLabelsRef.current=cityGroup;"
          new = "const borderGroup=new THREE.Group(),riverGroup=new THREE.Group(),countryGroup=new THREE.Group(),cityGroup=new THREE.Group();cityGroup.visible=false;scene.add(borderGroup,riverGroup,countryGroup,cityGroup);borderRef.current=borderGroup;riverRef.current=riverGroup;countryLabelsRef.current=countryGroup;cityLabelsRef.current=cityGroup;"
          assert old in t
          t = t.replace(old, new, 1)

          old = "const updateDynamic=()=>{const d=camera.position.length();camDir.copy(camera.position).normalize();const countryMin=d>2.2?.018:d>1.72?.006:d>1.38?.0018:.0002;for(const obj of countryGroup.children){objDir.copy(obj.position).normalize();const show=objDir.dot(camDir)>.61&&obj.userData.area>=countryMin;obj.element.style.display=show?'block':'none'}for(const obj of cityGroup.children){const p=obj.userData.place;objDir.copy(obj.position).normalize();const front=objDir.dot(camDir)>.72;const nearEnough=p.kind==='capital'?d<=CAPITAL_DISTANCE:d<=CITY_DISTANCE;obj.element.style.display=zoomIntentRef.current&&front&&nearEnough?'block':'none'}for(const line of riverGroup.children){const tier=line.userData.tier;line.visible=tier===0||(tier===1&&d<2.05)||(tier===2&&d<1.42)}};"
          new = "const updateDynamic=()=>{const d=camera.position.length();if(d<1.32)loadCloseSurface();camDir.copy(camera.position).normalize();const countryMin=d>2.2?.018:d>1.72?.006:d>1.38?.0018:.0002;for(const obj of countryGroup.children){objDir.copy(obj.position).normalize();const show=objDir.dot(camDir)>.61&&obj.userData.area>=countryMin;obj.element.style.display=show?'block':'none'}const cityGate=zoomIntentRef.current&&d<=CAPITAL_DISTANCE;cityGroup.visible=cityGate;for(const obj of cityGroup.children){if(!cityGate){obj.element.style.display='none';continue}const p=obj.userData.place;objDir.copy(obj.position).normalize();const front=objDir.dot(camDir)>.78;const nearEnough=p.kind==='capital'?d<=CAPITAL_DISTANCE:d<=CITY_DISTANCE;obj.element.style.display=front&&nearEnough?'block':'none'}for(const line of riverGroup.children){const tier=line.userData.tier;line.visible=tier===0||(tier===1&&d<2.05)||(tier===2&&d<1.42)}};"
          assert old in t
          t = t.replace(old, new, 1)

          old = "const render=()=>{updateDynamic();renderer.render(scene,camera);labels.render(scene,camera)};renderRef.current=render;const onChange=()=>{const d=camera.position.length();if(!runtime.suppressZoom&&d<1.4&&d<runtime.lastDistance-.0025)zoomIntentRef.current=true;runtime.lastDistance=d;render()};"
          new = "const render=()=>{updateDynamic();renderer.render(scene,camera);labels.render(scene,camera)};renderRef.current=render;const onChange=()=>{const d=camera.position.length();if(!runtime.suppressZoom&&d<1.2&&d<runtime.lastDistance-.0025)zoomIntentRef.current=true;if(d>CAPITAL_DISTANCE+.08)zoomIntentRef.current=false;runtime.lastDistance=d;render()};"
          assert old in t
          t = t.replace(old, new, 1)

          old = "useEffect(()=>{const group=cityLabelsRef.current;if(!group)return;group.children.forEach(o=>o.element?.remove?.());group.clear();for(const p of activePlaces)group.add(makeCityLabel(p));zoomIntentRef.current=false;renderRef.current()},[activePlaces]);"
          new = "useEffect(()=>{const group=cityLabelsRef.current;if(!group)return;group.children.forEach(o=>o.element?.remove?.());group.clear();group.visible=false;for(const p of activePlaces)group.add(makeCityLabel(p));for(const obj of group.children)obj.element.style.display='none';zoomIntentRef.current=false;renderRef.current()},[activePlaces]);"
          assert old in t
          t = t.replace(old, new, 1)

          old = "const focusRussia=useCallback(()=>{const r=sceneRef.current;if(!r)return;const[lon,lat]=period.focus;zoomIntentRef.current=false;r.suppressZoom=true;"
          new = "const focusRussia=useCallback(()=>{const r=sceneRef.current;if(!r)return;const[lon,lat]=period.focus;zoomIntentRef.current=false;if(cityLabelsRef.current){cityLabelsRef.current.visible=false;for(const obj of cityLabelsRef.current.children)obj.element.style.display='none'}r.suppressZoom=true;"
          assert old in t
          t = t.replace(old, new, 1)

          old = "function zoom(f){const r=sceneRef.current;if(!r)return;const before=r.camera.position.length(),v=r.camera.position.clone();v.setLength(clamp(before*f,1.03,7));if(v.length()<1.4&&v.length()<before-.002)zoomIntentRef.current=true;"
          new = "function zoom(f){const r=sceneRef.current;if(!r)return;const before=r.camera.position.length(),v=r.camera.position.clone();v.setLength(clamp(before*f,1.03,7));if(v.length()<1.2&&v.length()<before-.002)zoomIntentRef.current=true;if(v.length()>CAPITAL_DISTANCE+.08)zoomIntentRef.current=false;"
          assert old in t
          t = t.replace(old, new, 1)

          src.write_text(t)

      - name: Commit V22 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/sync-historical-world.mjs src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          git commit -m 'Upgrade territory close-up terrain and city gating'
          git push origin HEAD:main
