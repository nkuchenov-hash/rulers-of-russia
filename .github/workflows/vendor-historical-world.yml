name: Vendor historical world boundary archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-historical-world.mjs'
      - '.github/workflows/vendor-historical-world.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Download pinned historical world snapshots
        run: node scripts/sync-historical-world.mjs

      - name: Commit project-owned archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/territory/world-history public/data/territory/cultural
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Vendor historical world boundary archive'
          git push
