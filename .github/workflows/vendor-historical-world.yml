name: Vendor historical world archive

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-historical-world.mjs'
      - '.github/workflows/vendor-historical-world.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download pinned historical world snapshots
        run: node scripts/sync-historical-world.mjs
      - name: Commit project-owned archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/territory/world-history
          if git diff --cached --quiet; then
            echo 'Archive already current.'
            exit 0
          fi
          git commit -m 'Vendor historical world boundary archive'
          git push
