name: Postwar USSR geometry controls (diagnostic)

on:
  pull_request:
    paths:
      - 'scripts/postwar-controls.mjs'
      - 'scripts/postwar-controls.test.mjs'
      - 'scripts/postwar-topology.todo.test.mjs'
      - 'scripts/postwar-multipolygon-overlap.todo.test.mjs'
      - 'scripts/postwar-ring-topology.mjs'
      - 'scripts/postwar-seam-audit.mjs'
      - 'scripts/postwar-seam-audit.test.mjs'
      - 'scripts/postwar-periodic-seam-sidedness.test.mjs'
      - 'scripts/postwar-seam-sidedness-audit.mjs'
      - 'scripts/postwar-seam-sidedness-audit.test.mjs'
      - 'scripts/postwar-1945-seam-evidence.test.mjs'
      - 'scripts/postwar-1945-seam-fixture.test.mjs'
      - 'scripts/postwar-1945-seam-coverage.test.mjs'
      - 'public/data/territory/world-history/snapshots/1945.geojson'
      - '.github/workflows/postwar-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute synthetic and actual 1945 snapshot controls
        run: node --test scripts/postwar-controls.test.mjs scripts/postwar-topology.todo.test.mjs scripts/postwar-multipolygon-overlap.todo.test.mjs
      - name: Test seam evidence extraction
        if: always()
        run: node --test scripts/postwar-seam-audit.test.mjs scripts/postwar-1945-seam-evidence.test.mjs scripts/postwar-1945-seam-fixture.test.mjs scripts/postwar-1945-seam-coverage.test.mjs scripts/postwar-periodic-seam-sidedness.test.mjs scripts/postwar-seam-sidedness-audit.test.mjs
      - name: Print local sidedness of real 1945 seam
        if: always()
        run: node scripts/postwar-seam-sidedness-audit.mjs public/data/territory/world-history/snapshots/1945.geojson USSR
      - name: Print seam contacts in actual 1945 geometry
        if: always()
        run: node scripts/postwar-seam-audit.mjs public/data/territory/world-history/snapshots/1945.geojson USSR > /tmp/ussr-seam-evidence.json && node -e "const d=require('/tmp/ussr-seam-evidence.json'); console.log(JSON.stringify({polygonCount:d.polygonCount,seamRingCount:d.seamRingCount,contacts:d.contacts.slice(0,50),contactCount:d.contacts.length,seamEdgeOverlapCount:d.seamEdgeOverlaps.length,seamEdgeOverlaps:d.seamEdgeOverlaps.slice(0,50)},null,2))"
      - name: Print detailed control outcomes
        if: always()
        run: node scripts/postwar-controls.mjs public/data/territory/world-history/snapshots/1945.geojson USSR
