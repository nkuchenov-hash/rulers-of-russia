name: USSR 1946 1952 Poland component
on:
  pull_request:
    paths:
      - scripts/analyze-ussr-1946-1952-poland.mjs
      - .github/workflows/ussr-1946-1952-poland.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-ussr-1946-1952-poland.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-1946-1952-poland-component
          path: ussr-1946-1952-poland-component.json
