name: Probe NSPD state border once

on:
  push:
    paths:
      - 'scripts/probe-nspd-state-border.mjs'
      - '.github/workflows/probe-nspd-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe state-border WMS GetFeatureInfo
        run: node scripts/probe-nspd-state-border.mjs
