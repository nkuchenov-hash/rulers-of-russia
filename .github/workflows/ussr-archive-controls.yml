name: USSR archive controls
on:
  pull_request:
    paths:
      - scripts/analyze-ussr-archive.mjs
      - .github/workflows/ussr-archive-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-ussr-archive.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-archive-controls
          path: ussr-archive-controls.json
