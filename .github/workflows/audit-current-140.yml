name: Audit current History Core
on:
  push:
    branches: [research/audit-current-140]
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find metadata-only records missing explicit action
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'; import path from 'node:path';
          const root='public/data/history-core';
          const model=JSON.parse(fs.readFileSync(path.join(root,'territory-model.json'),'utf8'));
          const rows=[];
          for(const rel of model.changeFiles??[]){
            const data=JSON.parse(fs.readFileSync(path.join(root,rel),'utf8'));
            for(const c of data.territoryChanges??[]){
              if(c.geometry?.method==='metadata-only' && c.geometryAction!=='metadata-only') rows.push({id:c.id,file:rel,track:c.track,operation:c.operation,geometryAction:c.geometryAction??null});
            }
          }
          console.log('METADATA_ACTION_MISMATCHES',JSON.stringify(rows,null,2));
          NODE
