name: OHM Tsardom 1556 relation check
on:
  pull_request:
    paths:
      - scripts/check-ohm-tsardom-2890617.mjs
      - .github/workflows/ohm-tsardom-2890617-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-ohm-tsardom-2890617.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ohm-tsardom-2890617
          path: ohm-tsardom-2890617.json
