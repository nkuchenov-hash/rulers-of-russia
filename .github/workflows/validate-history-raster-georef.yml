name: Validate History Core raster georeference
on:
  push:
    branches: [history/early-rus-862-base]
permissions:
  contents: read
jobs:
  validate-history-raster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Materialize all registered history geometry
        run: npm run materialize:history-geometry
      - name: Validate coordinate and raster geometry recipes
        run: npm run validate:history-geometry
      - name: Validate History Core provenance
        run: npm run validate:history
      - name: Materialize full monthly history
        run: npm run materialize:history
      - name: Print strict completion delta
        shell: bash
        run: |
          node scripts/audit-history-completion.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit=JSON.parse(fs.readFileSync('public/data/history-core/generated/completion-audit.json','utf8'));
          console.log('HISTORY_PROGRESS_COUNTS',JSON.stringify(audit.counts));
          console.log('HISTORY_PROGRESS_CRITERIA',JSON.stringify(audit.criteria));
          NODE
