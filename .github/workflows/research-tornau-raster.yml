name: Research Tornau raster

on:
  push:
    branches:
      - research/tornau-raster-analysis

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raster/OCR tools
        run: |
          python -m pip install --quiet pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
      - name: Download public-domain Tornau rasters
        run: |
          mkdir -p /tmp/tornau
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_Rus%27,_862.gif" -o /tmp/tornau/862.gif
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_the_Rus,_1054-1240.gif" -o /tmp/tornau/1054-1240.gif
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_Rus%27,_1240-1533.gif" -o /tmp/tornau/1240-1533.gif
      - name: Analyze hashes, palette, components and legend OCR
        run: |
          mkdir -p tmp
          cat > /tmp/tornau/analyze.py <<'PY'
          from PIL import Image
          import numpy as np, hashlib, json, subprocess, re, os
          from collections import Counter, deque

          files = {
              '862-1054-sheet': '/tmp/tornau/862.gif',
              '1054-1240-sheet': '/tmp/tornau/1054-1240.gif',
              '1240-1533-sheet': '/tmp/tornau/1240-1533.gif',
          }
          out = {'purpose': 'non-production research only; do not promote geometry from this file directly', 'files': {}}

          for key, path in files.items():
              raw = open(path, 'rb').read()
              img = Image.open(path)
              entry = {
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
                  'width': img.width,
                  'height': img.height,
                  'mode': img.mode,
              }
              if img.mode == 'P':
                  arr = np.array(img)
                  palette = img.getpalette() or []
                  counts = Counter(arr.ravel().tolist())
                  top = []
                  for idx, count in counts.most_common(40):
                      base = idx * 3
                      rgb = palette[base:base+3] if base + 2 < len(palette) else [None, None, None]
                      top.append({'paletteIndex': int(idx), 'rgb': rgb, 'count': int(count)})
                  entry['topPalette'] = top
              else:
                  rgb = np.array(img.convert('RGB'))
                  colors = Counter(map(tuple, rgb.reshape(-1, 3).tolist()))
                  entry['topPalette'] = [{'rgb': list(c), 'count': int(n)} for c,n in colors.most_common(40)]
              out['files'][key] = entry

          # The current verified GCPs place Tornau map no. 2 (Rus 862-1054) in this sheet region.
          img = Image.open(files['862-1054-sheet']).convert('P')
          arr = np.array(img)
          palette = img.getpalette() or []
          x0, y0, x1, y1 = 120, 1320, 760, 1960
          roi = arr[y0:y1, x0:x1]
          counts = Counter(roi.ravel().tolist())
          region = {'bounds': [x0, y0, x1, y1], 'palette': [], 'components': []}
          for idx, count in counts.most_common(32):
              base = idx * 3
              rgb = palette[base:base+3] if base + 2 < len(palette) else [None,None,None]
              region['palette'].append({'paletteIndex': int(idx), 'rgb': rgb, 'count': int(count)})

          # Connected components only for common non-paper colors; exact palette index preserves source colors.
          candidate_indices = [idx for idx, count in counts.most_common(24)]
          h, w = roi.shape
          for idx in candidate_indices:
              mask = roi == idx
              seen = np.zeros(mask.shape, dtype=bool)
              comps = []
              for yy in range(h):
                  for xx in range(w):
                      if not mask[yy, xx] or seen[yy, xx]:
                          continue
                      stack = [(xx, yy)]
                      seen[yy, xx] = True
                      minx=maxx=xx; miny=maxy=yy; area=0
                      while stack:
                          cx, cy = stack.pop(); area += 1
                          minx=min(minx,cx); maxx=max(maxx,cx); miny=min(miny,cy); maxy=max(maxy,cy)
                          for nx, ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0 <= nx < w and 0 <= ny < h and mask[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx] = True; stack.append((nx,ny))
                      if area >= 100:
                          comps.append({'area': int(area), 'bbox': [int(minx+x0), int(miny+y0), int(maxx+x0), int(maxy+y0)]})
              if comps:
                  base = idx * 3
                  rgb = palette[base:base+3] if base + 2 < len(palette) else [None,None,None]
                  region['components'].append({'paletteIndex': int(idx), 'rgb': rgb, 'components': sorted(comps, key=lambda c:c['area'], reverse=True)[:20]})
          out['rus862_1054_region'] = region

          # OCR exact sheet; keep only lines relevant to ruler/interval legend and dates, with source pixel boxes.
          png = '/tmp/tornau/862.png'
          Image.open(files['862-1054-sheet']).convert('RGB').save(png)
          proc = subprocess.run(['tesseract', png, 'stdout', '-l', 'rus+eng', '--psm', '11', 'tsv'], text=True, capture_output=True, check=True)
          matches = []
          pattern = re.compile(r'(Рюрик|Рюри|Олег|Игор|Святослав|Владимир|Ярослав|владен|862|879|882|912|945|946|972|980|1015|1019|1054)', re.I)
          for line in proc.stdout.splitlines()[1:]:
              cols = line.split('\t')
              if len(cols) < 12: continue
              text = cols[11].strip()
              if not text or not pattern.search(text): continue
              try:
                  conf=float(cols[10]); left=int(cols[6]); top=int(cols[7]); width=int(cols[8]); height=int(cols[9])
              except Exception:
                  continue
              matches.append({'text': text, 'confidence': conf, 'bbox': [left, top, left+width, top+height]})
          out['legendOcrMatches'] = matches

          with open('tmp/tornau-research.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
          python /tmp/tornau/analyze.py
      - name: Commit research output to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/tornau-research.json
          git commit -m "research: capture Tornau raster analysis [skip ci]"
          git push
