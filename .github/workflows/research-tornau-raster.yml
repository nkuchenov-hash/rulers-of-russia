name: Research Tornau raster

on:
  push:
    branches:
      - research/tornau-raster-analysis

permissions:
  contents: write

jobs:
  analyze:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install raster/OCR tools
        run: |
          python -m pip install --quiet pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
      - name: Download public-domain Tornau rasters
        run: |
          mkdir -p /tmp/tornau
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_Rus%27,_862.gif" -o /tmp/tornau/862.gif
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_the_Rus,_1054-1240.gif" -o /tmp/tornau/1054-1240.gif
          curl -L --fail --retry 4 --retry-delay 2 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Historical_map_of_Rus%27,_1240-1533.gif" -o /tmp/tornau/1240-1533.gif
      - name: Analyze exact raster hashes and 862-1054 legend region
        run: |
          mkdir -p tmp
          cat > /tmp/tornau/analyze.py <<'PY'
          from PIL import Image
          import numpy as np, hashlib, json, subprocess, re
          from collections import Counter

          files = {
              '862-1054-sheet': '/tmp/tornau/862.gif',
              '1054-1240-sheet': '/tmp/tornau/1054-1240.gif',
              '1240-1533-sheet': '/tmp/tornau/1240-1533.gif',
          }
          out = {'purpose': 'non-production research only; do not promote geometry from this file directly', 'files': {}}
          for key, path in files.items():
              raw = open(path, 'rb').read()
              img = Image.open(path)
              out['files'][key] = {
                  'sha256': hashlib.sha256(raw).hexdigest(),
                  'bytes': len(raw),
                  'width': img.width,
                  'height': img.height,
                  'mode': img.mode,
              }

          imgp = Image.open(files['862-1054-sheet']).convert('P')
          arr = np.array(imgp)
          palette = imgp.getpalette() or []
          png = '/tmp/tornau/862.png'
          Image.open(files['862-1054-sheet']).convert('RGB').save(png)
          proc = subprocess.run(['tesseract', png, 'stdout', '-l', 'rus+eng', '--psm', '11', 'tsv'], text=True, capture_output=True, check=True)
          words = []
          all_words = []
          for line in proc.stdout.splitlines()[1:]:
              cols = line.split('\t')
              if len(cols) < 12: continue
              text = cols[11].strip()
              if not text: continue
              try:
                  conf=float(cols[10]); left=int(cols[6]); top=int(cols[7]); width=int(cols[8]); height=int(cols[9])
              except Exception: continue
              item={'text':text,'confidence':conf,'bbox':[left,top,left+width,top+height]}
              all_words.append(item)
              if left >= 740 and 1320 <= top <= 1960 and conf >= 15:
                  words.append(item)
          out['legendRegionWords'] = words

          year_pat = re.compile(r'(862|879|882|912|945|946|972|980|1015|1019|1054)')
          dated = []
          for item in all_words:
              if not year_pat.search(item['text']): continue
              left,top,right,bottom=item['bbox']
              y0=max(0,top-6); y1=min(arr.shape[0],bottom+7)
              x0=max(0,left-260); x1=max(x0+1,left-8)
              strip=arr[y0:y1,x0:x1]
              counts=Counter(strip.ravel().tolist())
              colors=[]
              for idx,count in counts.most_common(20):
                  base=idx*3
                  rgb=palette[base:base+3] if base+2 < len(palette) else [None,None,None]
                  colors.append({'paletteIndex':int(idx),'rgb':rgb,'count':int(count)})
              dated.append({**item,'leftBand':[x0,y0,x1,y1],'leftBandPalette':colors})
          out['datedLegendCandidates'] = dated

          # Connected components in the right-side legend candidate area. Saturated/colored components are especially useful for linking swatches to OCR rows.
          x0,y0,x1,y1=740,1320,1180,1960
          roi=arr[y0:y1,x0:x1]
          counts=Counter(roi.ravel().tolist())
          components=[]
          h,w=roi.shape
          for idx,count in counts.most_common(100):
              base=idx*3
              rgb=palette[base:base+3] if base+2 < len(palette) else [0,0,0]
              if any(v is None for v in rgb): continue
              spread=max(rgb)-min(rgb)
              if spread < 18: continue
              mask=roi==idx
              seen=np.zeros(mask.shape,dtype=bool)
              comps=[]
              for yy in range(h):
                  for xx in range(w):
                      if not mask[yy,xx] or seen[yy,xx]: continue
                      stack=[(xx,yy)]; seen[yy,xx]=True
                      minx=maxx=xx; miny=maxy=yy; area=0
                      while stack:
                          cx,cy=stack.pop(); area+=1
                          minx=min(minx,cx); maxx=max(maxx,cx); miny=min(miny,cy); maxy=max(maxy,cy)
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0<=nx<w and 0<=ny<h and mask[ny,nx] and not seen[ny,nx]:
                                  seen[ny,nx]=True; stack.append((nx,ny))
                      if area>=20:
                          comps.append({'area':int(area),'bbox':[int(minx+x0),int(miny+y0),int(maxx+x0),int(maxy+y0)]})
              if comps:
                  components.append({'paletteIndex':int(idx),'rgb':rgb,'totalInLegendRoi':int(count),'components':sorted(comps,key=lambda c:c['area'],reverse=True)[:30]})
          out['legendColorComponents']=components

          with open('tmp/tornau-legend-analysis.json','w',encoding='utf-8') as f:
              json.dump(out,f,ensure_ascii=False,indent=2); f.write('\n')
          PY
          python /tmp/tornau/analyze.py
      - name: Commit research output to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/tornau-legend-analysis.json
          git commit -m "research: refine Tornau legend analysis [skip ci]"
          git push
