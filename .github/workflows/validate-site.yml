name: Validate rulers site

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulers-validate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Materialize History Core geometry
        run: npm run materialize:history-geometry

      - name: Validate History Core geometry recipes
        run: npm run validate:history-geometry

      - name: Validate History Core provenance
        run: npm run validate:history

      - name: Materialize monthly History Core
        run: npm run materialize:history

      - name: Audit History Core completion state
        run: node scripts/audit-history-completion.mjs

      - name: Upload strict completion audit
        uses: actions/upload-artifact@v4
        with:
          name: history-completion-audit
          path: public/data/history-core/generated/completion-audit.json
          if-no-files-found: error

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build
