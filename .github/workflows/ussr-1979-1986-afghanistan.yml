name: USSR 1979 1986 Afghanistan component
on:
  pull_request:
    paths:
      - scripts/analyze-ussr-1979-1986-afghanistan.mjs
      - .github/workflows/ussr-1979-1986-afghanistan.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-ussr-1979-1986-afghanistan.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-1979-1986-afghanistan-component
          path: ussr-1979-1986-afghanistan-component.json
