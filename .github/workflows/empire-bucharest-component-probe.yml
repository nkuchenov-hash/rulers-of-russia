name: Empire Bucharest component probe
on:
  pull_request:
    paths:
      - scripts/probe-empire-bucharest-component.mjs
      - .github/workflows/empire-bucharest-component-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/probe-empire-bucharest-component.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-bucharest-component-probe
          path: empire-bucharest-component-probe.json
