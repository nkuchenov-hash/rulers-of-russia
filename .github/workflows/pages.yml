name: Deploy live site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-production-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Write deploy marker
        run: |
          mkdir -p public
          printf '{"sha":"%s","run_id":"%s","built_at":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy.json

      - name: Typecheck
        run: npm run typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Verify deploy marker in artifact
        run: |
          test -f out/deploy.json
          cat out/deploy.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful deployment
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.github/pages-last-success.json';
            const body = JSON.stringify({
              sha: context.sha,
              run_id: context.runId,
              deployed_at: new Date().toISOString(),
              page_url: process.env.PAGE_URL
            }, null, 2) + '\n';
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `[skip ci] Record Pages deploy ${context.sha.slice(0, 12)}`,
              content: Buffer.from(body).toString('base64'),
              branch: 'main',
              sha: existingSha
            });
