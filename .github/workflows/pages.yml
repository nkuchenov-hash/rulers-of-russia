name: Deploy live site to GitHub Pages

on:
  workflow_run:
    workflows:
      - Validate rulers site
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rulers-pages-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait until validated PR revision is present in main
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin main --prune
            if git merge-base --is-ancestor "$VALIDATED_SHA" origin/main; then
              git checkout --detach origin/main
              echo "Validated SHA $VALIDATED_SHA is now contained in main."
              exit 0
            fi
            echo "Waiting for validated SHA $VALIDATED_SHA to reach main ($attempt/60)..."
            sleep 10
          done
          echo "Validated SHA $VALIDATED_SHA did not reach main within 10 minutes."
          exit 1

      - name: Ensure manual deploy uses current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch origin main --prune
          git checkout --detach origin/main

      - name: Resolve deployed revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Write deploy marker
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p public
          printf '{"sha":"%s","run_id":"%s","built_at":"%s"}\n' "$DEPLOY_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy.json

      - name: Typecheck
        run: npm run typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Verify territory route and deploy marker
        run: |
          test -f out/deploy.json
          test -f out/territory/index.html
          cat out/deploy.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
