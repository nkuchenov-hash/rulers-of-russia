name: Deploy live site to GitHub Pages

on:
  workflow_run:
    workflows:
      - Validate rulers site
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rulers-pages-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve validated revision
        id: revision
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "sha=$MANUAL_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$VALIDATED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Write deploy marker
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p public
          printf '{"sha":"%s","run_id":"%s","built_at":"%s"}\n' "$DEPLOY_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy.json

      - name: Typecheck
        run: npm run typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Verify deploy marker in artifact
        run: |
          test -f out/deploy.json
          cat out/deploy.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
