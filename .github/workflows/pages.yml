name: Deploy live site to GitHub Pages

on:
  workflow_run:
    workflows:
      - Validate rulers site
      - Validate merged main
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rulers-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait until validated revision is present in main
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin main --prune
            if git merge-base --is-ancestor "$VALIDATED_SHA" origin/main; then
              git checkout --detach origin/main
              echo "Validated SHA $VALIDATED_SHA is now contained in main."
              exit 0
            fi
            echo "Waiting for validated SHA $VALIDATED_SHA to reach main ($attempt/60)..."
            sleep 10
          done
          echo "Validated SHA $VALIDATED_SHA did not reach main within 10 minutes."
          exit 1

      - name: Ensure manual deploy uses current main
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch origin main --prune
          git checkout --detach origin/main

      - name: Resolve deployed revision
        id: revision
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate History Core provenance
        run: npm run validate:history

      - name: Materialize complete historical territory timeline
        run: npm run materialize:history

      - name: Verify complete month coverage
        run: node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('public/data/history-core/generated/month-index.json','utf8'));if(!x.complete||x.monthCount!==13980)throw new Error('History month coverage incomplete: '+x.monthCount);console.log('History coverage:',x.minMonth,'..',x.maxMonth,x.monthCount,'months');"

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Write deploy marker
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          mkdir -p public
          printf '{"sha":"%s","run_id":"%s","built_at":"%s"}\n' "$DEPLOY_SHA" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/deploy.json

      - name: Typecheck
        run: npm run typecheck

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run build

      - name: Verify territory routes, history materialization and deploy marker
        run: |
          test -f out/deploy.json
          test -f out/territory/index.html
          test -f out/territory/atlas-lab/index.html
          test -f out/data/history-core/generated/territory/index.json
          test -f out/data/history-core/generated/month-index.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('out/data/history-core/generated/month-index.json','utf8'));if(x.monthCount!==13980)process.exit(1);"
          cat out/deploy.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages endpoints
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail
          BASE='https://nkuchenov-hash.github.io/rulers-of-russia'
          for attempt in $(seq 1 30); do
            if curl -fsSL "$BASE/territory/" -o /tmp/territory.html && \
               curl -fsSL "$BASE/territory/atlas-lab/" -o /tmp/atlas-lab.html && \
               curl -fsSL "$BASE/data/history-core/generated/territory/index.json" -o /tmp/history-territory.json && \
               curl -fsSL "$BASE/data/history-core/generated/month-index.json" -o /tmp/month-index.json && \
               curl -fsSL "$BASE/deploy.json" -o /tmp/deploy.json; then
              LIVE_SHA="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/deploy.json','utf8'));process.stdout.write(x.sha||'')")"
              MONTH_COUNT="$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/month-index.json','utf8'));process.stdout.write(String(x.monthCount||0))")"
              if [ "$LIVE_SHA" = "$EXPECTED_SHA" ] && [ "$MONTH_COUNT" = "13980" ]; then
                echo "Live territory, 13980-month History Core and Atlas Lab confirmed for $LIVE_SHA"
                exit 0
              fi
            fi
            echo "Waiting for live Pages propagation ($attempt/30)..."
            sleep 10
          done
          echo 'Live Pages verification failed.'
          exit 1

      - name: Publish live verification marker
        if: success()
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.revision.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERIFIED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          rm -rf /tmp/pages-status
          mkdir -p /tmp/pages-status
          cd /tmp/pages-status
          git init
          git config user.name github-actions
          git config user.email github-actions@github.com
          printf '{"sha":"%s","run_id":"%s","verified_at":"%s","territory_url":"https://nkuchenov-hash.github.io/rulers-of-russia/territory/","atlas_lab_url":"https://nkuchenov-hash.github.io/rulers-of-russia/territory/atlas-lab/"}\n' "$DEPLOY_SHA" "$GITHUB_RUN_ID" "$VERIFIED_AT" > status.json
          git add status.json
          git commit -m "Record verified live Pages deployment"
          git branch -M pages-status
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin pages-status
