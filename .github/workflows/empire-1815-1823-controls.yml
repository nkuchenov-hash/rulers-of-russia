name: Empire 1815 1823 controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1815-1823.mjs
      - .github/workflows/empire-1815-1823-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1815-1823.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1815-1823-controls
          path: empire-1815-1823-controls.json
