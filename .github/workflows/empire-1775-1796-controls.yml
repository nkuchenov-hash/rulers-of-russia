name: Empire 1775 1796 controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1775-1796.mjs
      - .github/workflows/empire-1775-1796-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1775-1796.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1775-1796-controls
          path: empire-1775-1796-controls.json
