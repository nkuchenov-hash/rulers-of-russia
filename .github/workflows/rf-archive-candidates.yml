name: RF archive candidate research

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze-rf-archive-candidates.mjs'
      - '.github/workflows/rf-archive-candidates.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Analyze RF archive candidates
        run: node scripts/analyze-rf-archive-candidates.mjs
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: rf-archive-candidates
          path: rf-archive-candidates.json
