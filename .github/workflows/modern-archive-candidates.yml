name: Modern archive candidate research

on:
  pull_request:
    paths:
      - scripts/analyze-modern-archive-candidates.mjs
      - scripts/capture-ohm-rf-relation-metadata.mjs
      - public/data/territory/archive/ussr.geojson
      - public/data/territory/archive/russian-federation.geojson
      - .github/workflows/modern-archive-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate archived USSR and RF vector states
        run: node scripts/analyze-modern-archive-candidates.mjs
      - name: Capture current OHM source relation metadata
        run: node scripts/capture-ohm-rf-relation-metadata.mjs
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: modern-archive-candidates
          path: |
            modern-archive-candidates.json
            ohm-rf-relation-2800968.json
