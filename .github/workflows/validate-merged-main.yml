name: Validate merged main

on:
  pull_request_target:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulers-merged-main-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-main:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build
