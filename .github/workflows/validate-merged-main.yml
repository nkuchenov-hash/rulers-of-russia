name: Validate merged main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulers-merged-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Reject critical production dependency vulnerabilities
        run: npm audit --audit-level=critical --omit=dev

      - name: Materialize verified source-coordinate geometry
        run: npm run materialize:history-geometry

      - name: Validate source-coordinate geometry recipes
        run: npm run validate:history-geometry

      - name: Validate History Core provenance
        run: npm run validate:history

      - name: Materialize complete historical territory timeline
        run: npm run materialize:history

      - name: Audit true History Core completion
        run: node scripts/audit-history-completion.mjs

      - name: Persist strict History Core audit
        uses: actions/upload-artifact@v4
        with:
          name: history-core-strict-audit-${{ github.sha }}
          path: public/data/history-core/generated/completion-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist generated History Core month index
        uses: actions/upload-artifact@v4
        with:
          name: history-core-month-index-${{ github.sha }}
          path: public/data/history-core/generated/month-index.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify complete month coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('public/data/history-core/generated/month-index.json', 'utf8'));
          if (!x.complete || x.monthCount !== 13980) throw new Error(`History month coverage incomplete: ${x.monthCount}`);
          console.log('History coverage:', x.minMonth, '..', x.maxMonth, x.monthCount, 'months');
          NODE

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify territory route exists
        run: test -f out/territory/index.html
