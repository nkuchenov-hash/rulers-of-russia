name: Validate merged main

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rulers-merged-main-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-main:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm merged revision is present on main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$MERGE_SHA" origin/main
          echo "Merged SHA: $MERGE_SHA"
          echo "Current main: $(git rev-parse HEAD)"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Materialize verified source-coordinate geometry
        run: npm run materialize:history-geometry

      - name: Materialize source-verified historical reconstructions
        run: npm run materialize:history-reconstructions

      - name: Validate source-coordinate geometry recipes
        run: npm run validate:history-geometry

      - name: Validate historical reconstruction recipes
        run: npm run validate:history-reconstructions

      - name: Validate History Core provenance
        run: npm run validate:history

      - name: Materialize complete historical territory timeline
        run: npm run materialize:history

      - name: Verify complete month coverage
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync('public/data/history-core/generated/month-index.json', 'utf8'));
          if (!x.complete || x.monthCount !== 13980) throw new Error(`History month coverage incomplete: ${x.monthCount}`);
          console.log('History coverage:', x.minMonth, '..', x.maxMonth, x.monthCount, 'months');
          NODE

      - name: Prepare local historical world archive
        run: node scripts/sync-historical-world.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Verify territory route exists
        run: test -f out/territory/index.html
