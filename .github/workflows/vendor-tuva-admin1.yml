name: Vendor Tuva admin1
on:
  push:
    branches:
      - 'history-core/ussr-1944-1946-derived'
    paths:
      - 'scripts/vendor-tuva-admin1.mjs'
      - '.github/workflows/vendor-tuva-admin1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'history-core/ussr-1944-1946-derived'
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/vendor-tuva-admin1.mjs
      - name: Commit selected public-domain geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/territory/cultural/tuva_admin1_selected_10m.geojson
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Vendor selected Tuva admin-1 geometry'
          git push origin HEAD:history-core/ussr-1944-1946-derived
