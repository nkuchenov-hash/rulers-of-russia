name: Validate territory in Chromium

on:
  push:
    branches:
      - territory-v31-restore-stable-single-surface
    paths:
      - 'src/app/territory/**'
      - 'scripts/territory-browser-smoke.mjs'
      - 'scripts/territory-history-smoke.mjs'
      - 'scripts/serve-territory-smoke.mjs'
      - '.github/workflows/validate-territory-browser.yml'
  pull_request:
    paths:
      - 'src/app/territory/**'
      - 'scripts/territory-browser-smoke.mjs'
      - 'scripts/territory-history-smoke.mjs'
      - 'scripts/serve-territory-smoke.mjs'
      - '.github/workflows/validate-territory-browser.yml'
  workflow_run:
    workflows:
      - Deploy live site to GitHub Pages
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout proposed revision
        if: github.event_name != 'workflow_run'
        uses: actions/checkout@v4

      - name: Checkout deployed main
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install

      - name: Prepare local historical world archive
        if: github.event_name != 'workflow_run'
        run: node scripts/sync-historical-world.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build production-layout static site
        if: github.event_name != 'workflow_run'
        run: npm run build

      - name: Start basePath-aware static server
        if: github.event_name != 'workflow_run'
        run: |
          node scripts/serve-territory-smoke.mjs > /tmp/territory-serve.log 2>&1 &
          echo $! > /tmp/territory-serve.pid
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/rulers-of-russia/territory/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/territory-serve.log
          exit 1

      - name: Execute current territory in Chromium
        env:
          TERRITORY_SMOKE_URL: ${{ github.event_name == 'workflow_run' && format('https://nkuchenov-hash.github.io/rulers-of-russia/territory/?smoke={0}', github.run_id) || '' }}
        run: node scripts/territory-browser-smoke.mjs

      - name: Execute historical 1988 territory in Chromium
        env:
          TERRITORY_SMOKE_URL: ${{ github.event_name == 'workflow_run' && format('https://nkuchenov-hash.github.io/rulers-of-russia/territory/?history_smoke={0}', github.run_id) || '' }}
        run: node scripts/territory-history-smoke.mjs

      - name: Show server log on failure
        if: failure() && github.event_name != 'workflow_run'
        run: cat /tmp/territory-serve.log || true
