name: Empire 1880 1900 controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1880-1900.mjs
      - .github/workflows/empire-1880-1900-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1880-1900.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1880-1900-controls
          path: empire-1880-1900-controls.json
