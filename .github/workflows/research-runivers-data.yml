name: Research Runivers historical GIS
on:
  push:
    branches: [history/runivers-medieval-bases]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Map live Runivers GIS resources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse
          base='https://gis.runivers.ru/api/resource'
          ids=[1812,5344,11486,13818,14878,15948,6872,916]
          def get(url):
              with urllib.request.urlopen(url,timeout=60) as r:
                  return json.load(r)
          def summary(obj):
              r=obj.get('resource',{})
              fl=obj.get('feature_layer',{})
              return {
                  'id':r.get('id'),'cls':r.get('cls'),'name':r.get('display_name'),'keyname':r.get('keyname'),
                  'parent':(r.get('parent') or {}).get('id'),'children':r.get('children'),
                  'geometry':fl.get('geometry_type'),'srs':((fl.get('srs') or {}).get('id')),
                  'fields':[f.get('keyname') for f in fl.get('fields',[])],
                  'description':r.get('description')
              }
          for rid in ids:
              print(f'=== RESOURCE {rid} ===')
              try: print(json.dumps(summary(get(f'{base}/{rid}')),ensure_ascii=False))
              except Exception as e: print('ERROR',repr(e)); continue
              print(f'=== CHILDREN {rid} ===')
              try:
                  children=get(f'{base}/?parent={rid}')
                  rows=[summary(x) for x in children]
                  print('COUNT',len(rows))
                  for row in rows[:1000]: print(json.dumps(row,ensure_ascii=False))
              except Exception as e: print('ERROR',repr(e))
          # Inspect source/status values from master boundary lines without dumping all geometry.
          for rid in [6872,916]:
              print(f'=== FEATURE SAMPLE {rid} ===')
              for query in ['limit=5','limit=20&fields=srcdata,lwdate,upperdat,lwdtappr,updtappr,linetype,status,eventstart,linecomnt,updtrl']:
                  url=f'{base}/{rid}/feature/?{query}'
                  try:
                      data=get(url)
                      print(url)
                      print(json.dumps(data[:20] if isinstance(data,list) else data,ensure_ascii=False)[:30000])
                      break
                  except Exception as e: print('FEATURE_ERROR',url,repr(e))
          PY
