name: Research Runivers early polygon snapshots
on:
  push:
    branches: [history/runivers-medieval-bases]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: history/runivers-medieval-bases
      - name: Capture early polygon snapshot catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re,urllib.request
          from pathlib import Path
          BASE='https://gis.runivers.ru/api/resource'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'rulers-of-russia-history-research/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r: return json.load(r)
          children=get(f'{BASE}/?parent=5344')
          rows=[]
          for x in children if isinstance(children,list) else []:
              r=x.get('resource',{}) if isinstance(x,dict) else {}
              fl=x.get('feature_layer',{}) if isinstance(x,dict) else {}
              name=str(r.get('display_name') or '')
              years=[int(y) for y in re.findall(r'(?<!\d)(\d{3,4})(?!\d)',name)]
              if years and min(years)<=1015:
                  rows.append({'id':r.get('id'),'name':name,'cls':r.get('cls'),'geometry':fl.get('geometry_type'),'srs':(fl.get('srs') or {}).get('id'),'fields':[f.get('keyname') for f in fl.get('fields',[])]})
          rows.sort(key=lambda x:(min([int(y) for y in re.findall(r'\d{3,4}',x['name'])] or [9999]),x['id'] or 0))
          out={'parent':5344,'count':len(rows),'resources':rows}
          Path('research-artifacts/runivers-early-polygon-catalog.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add research-artifacts/runivers-early-polygon-catalog.json
          git commit -m 'Capture early Runivers polygon snapshot catalog' || exit 0
          git push origin HEAD:history/runivers-medieval-bases
