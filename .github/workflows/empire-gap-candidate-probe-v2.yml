name: Empire gap candidate probe v2
on:
  pull_request:
    paths:
      - scripts/analyze-empire-gap-candidates-v2.mjs
      - .github/workflows/empire-gap-candidate-probe-v2.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-gap-candidates-v2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-gap-candidates-v2
          path: empire-gap-candidates-v2.json
