name: History 100pct batch
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/report-history-remaining.mjs'
      - 'scripts/report-history-archive-features.mjs'
      - '.github/workflows/history-100pct-batch.yml'
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node scripts/sync-historical-world.mjs
      - name: Report archive feature intervals
        run: node scripts/report-history-archive-features.mjs
      - run: npm run materialize:history-geometry
      - run: npm run validate:history-geometry
      - run: npm run validate:history
      - run: npm run materialize:history
      - name: Report exact remaining ranges and blockers
        run: node scripts/report-history-remaining.mjs
