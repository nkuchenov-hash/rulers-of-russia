name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  resolve-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect RSL viewer launch metadata and client code
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html
          base='https://search.rsl.ru'
          record='https://search.rsl.ru/ru/record/01009649842'
          req=urllib.request.Request(record,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          print('=== RELEVANT HTML ===')
          for line in page.splitlines():
            low=line.lower()
            if any(k in low for k in ['просмотр','viewer','ebook','fulltext','full-text','electronic','digital','read-online','access']) or '01009649842' in line:
              print(line[:5000])
          js_url=base+'/js/action-record.js?v=1787651650'
          req=urllib.request.Request(js_url,headers={'User-Agent':'Mozilla/5.0'})
          js=urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          print('=== ACTION RECORD JS ===')
          print(js[:30000])
          print('=== JS URL-LIKE STRINGS ===')
          for m in re.finditer(r'["\']([^"\']*(?:viewer|ebook|fulltext|digital|record|resource|file|content|book)[^"\']*)["\']',js,re.I):
            print(html.unescape(m.group(1))[:3000])
          PY
