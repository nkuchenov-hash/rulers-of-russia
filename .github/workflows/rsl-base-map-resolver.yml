name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  inspect-read-attrs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect read-url and free-access attributes in the RSL record HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html
          url='https://search.rsl.ru/ru/record/01009649842'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
          for needle in ['data-read-url','read-url','js-free-access-alert','rsl01009649842','viewer.rsl.ru','freeAccessAlert']:
            print('\n===',needle,'===')
            hits=list(re.finditer(re.escape(needle),page,re.I))
            print('COUNT',len(hits))
            for m in hits[:30]: print(page[max(0,m.start()-4000):min(len(page),m.end()+8000)])
          # Print every element whose data-* attributes contain access/read/viewer hints.
          for m in re.finditer(r'<[^>]+>',page,re.S):
            tag=m.group(0); low=tag.lower()
            if 'data-' in low and any(k in low for k in ['read','access','viewer','eorder']): print('DATA_TAG',tag[:12000])
          PY
