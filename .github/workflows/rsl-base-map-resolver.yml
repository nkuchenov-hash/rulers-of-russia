name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  probe-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract API config and probe document/page endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,json
          base='https://viewer.rsl.ru'
          def get(url, binary=False):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*'})
            with urllib.request.urlopen(req,timeout=90) as r:
              b=r.read(); return r.geturl(),r.headers, b if binary else b.decode('utf-8','replace')
          _,_,app=get(base+'/js/app.a6574da3.js')
          _,_,pdf=get(base+'/js/pdfModule.2b47014e.js')
          for label,js,needle in [
            ('CONFIG',app,'"0d4f":function'),
            ('FETCH_DOCUMENT',app,'fetchDocumentInfo:function'),
            ('PDF_DOCUMENT',pdf,'/document/'),
            ('PDF_PAGE',pdf,'/page/')]:
            i=js.find(needle)
            print('\n===',label,'INDEX',i,'===')
            if i>=0: print(js[max(0,i-3000):i+9000])
          candidates=[
            base+'/api/v1/document/rsl01009649842',
            base+'/api/v1/document/rsl01009649842/',
            base+'/api/v1/document/01009649842',
            base+'/api/v1/document/01009649842/',
          ]
          for u in candidates:
            try:
              final,h,txt=get(u); print('\nAPI_OK',u,'=>',final,'CTYPE',h.get('content-type'),'LEN',len(txt)); print(txt[:20000])
            except Exception as e: print('API_ERR',u,repr(e))
          PY
