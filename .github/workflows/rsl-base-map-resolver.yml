name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  download-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RSL page and inspect the 1927 USSR map
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq file imagemagick tesseract-ocr tesseract-ocr-rus poppler-utils >/dev/null
          mkdir -p /tmp/rsl1927
          for endpoint in page/1 pdf; do
            name=$(echo "$endpoint" | tr '/' '-')
            code=$(curl -L --retry 3 -sS -o "/tmp/rsl1927/$name.bin" -w '%{http_code}' \
              -H 'User-Agent: Mozilla/5.0' \
              "https://viewer.rsl.ru/api/v1/document/rsl01009649842/$endpoint" || true)
            echo "ENDPOINT $endpoint HTTP $code"
            file "/tmp/rsl1927/$name.bin" || true
            ls -lh "/tmp/rsl1927/$name.bin" || true
            head -c 100 "/tmp/rsl1927/$name.bin" | xxd || true
          done
          PAGE=/tmp/rsl1927/page-1.bin
          if file "$PAGE" | grep -qiE 'JPEG|PNG|TIFF|image'; then
            identify "$PAGE" || true
            cp "$PAGE" /tmp/rsl1927/map-page.jpg
            echo '=== OCR MAP ==='
            tesseract "$PAGE" stdout -l rus+eng --psm 11 2>/dev/null | head -n 200 || true
            convert "$PAGE" -resize '1800x1800>' /tmp/rsl1927/map-preview.jpg
          fi
          PDF=/tmp/rsl1927/pdf.bin
          if file "$PDF" | grep -qi PDF; then
            pdfinfo "$PDF" | head -n 30 || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsl-ussr-1927-map
          path: |
            /tmp/rsl1927/map-preview.jpg
            /tmp/rsl1927/map-page.jpg
          if-no-files-found: ignore
          retention-days: 7
