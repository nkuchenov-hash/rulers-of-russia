name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  late-project-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace all late ProjectData assignments in the RSL record HTML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re
          record='https://search.rsl.ru/ru/record/01009649842'
          req=urllib.request.Request(record,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
          needles=['fullDocumentId','hasFile','isAccessLevelDodInRoomDod','fullDocumentView','ProjectData.document','ProjectData.pages','ownershipSystem','accessLevel']
          for n in needles:
            print('\n===',n,'===')
            hits=list(re.finditer(re.escape(n),page,re.I))
            print('COUNT',len(hits))
            for m in hits[:50]: print(page[max(0,m.start()-5000):min(len(page),m.end()+10000)])
          print('\n=== ALL PROJECTDATA ASSIGNMENTS ===')
          for m in re.finditer(r'ProjectData(?:\.[A-Za-z0-9_]+)+\s*=\s*[^;]+;',page,re.S):
            print(m.group(0)[:30000])
          PY
