name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  trace-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace document field population across RSL JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,urllib.parse
          record='https://search.rsl.ru/ru/record/01009649842'
          base='https://search.rsl.ru'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':record})
            with urllib.request.urlopen(req,timeout=90) as r: return r.read().decode('utf-8','replace')
          page=get(record)
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I):
            u=html.unescape(m.group(1))
            if u.startswith('//'): u='https:'+u
            elif u.startswith('/'): u=base+u
            elif not u.startswith('http'): u=urllib.parse.urljoin(record,u)
            if 'search.rsl.ru' in u and u not in scripts: scripts.append(u)
          needles=['ProjectData.document =','ProjectData.document.','fullDocumentId','hasFile','docStorageId','record?id','ajax-record','documentData','recordData']
          for u in scripts:
            try: js=get(u)
            except Exception as e: print('ERR',u,repr(e)); continue
            hits=[]
            for n in needles:
              for m in re.finditer(re.escape(n),js,re.I): hits.append((m.start(),n))
            if not hits: continue
            print('\n===',u,'===')
            shown=[]
            for pos,n in sorted(hits):
              if any(abs(pos-p)<2000 for p in shown): continue
              shown.append(pos)
              print('\nHIT',n,'AT',pos)
              print(js[max(0,pos-5000):min(len(js),pos+12000)])
          PY
