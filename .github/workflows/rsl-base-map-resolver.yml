name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  resolve-viewer-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract actual viewer identifiers and access bootstrap data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,json
          url='https://search.rsl.ru/ru/record/01009649842'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          page=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
          print('RSL_IDS',sorted(set(re.findall(r'rsl\d{8,}',page,re.I))))
          print('VIEWER_URLS')
          for m in re.finditer(r'https?://viewer\.(?:rsl|rusneb)\.ru[^"\'<> ]+',page,re.I): print(html.unescape(m.group(0))[:2000])
          print('ALL_DATA_ATTRS_AROUND_ACCESS')
          for m in re.finditer(r'(?:freeAccess|Просмотрщик|Читать онлайн|openAccess|access)',page,re.I):
            print(page[max(0,m.start()-2500):min(len(page),m.end()+5000)])
          print('PROJECT_ASSIGNMENTS')
          for m in re.finditer(r'ProjectData(?:\.[A-Za-z0-9_]+)?\s*=\s*([^;]+);',page,re.S):
            print(m.group(0)[:30000])
          # Also print hidden inputs/data-* values containing document identifiers.
          for m in re.finditer(r'<[^>]+(?:data-[^=]+|value|href)=["\'][^"\']*(?:rsl|09649842)[^"\']*["\'][^>]*>',page,re.I):
            print('TAG',m.group(0)[:5000])
          PY
