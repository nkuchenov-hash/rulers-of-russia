name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  resolve-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate free-access viewer launcher and document metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,json,urllib.parse
          base='https://search.rsl.ru'
          record=base+'/ru/record/01009649842'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            return urllib.request.urlopen(req,timeout=60).read().decode('utf-8','replace')
          page=get(record)
          for pat,label in [
            (r'ProjectData\.document\s*=\s*(\{.*?\});','PROJECT_DOCUMENT'),
            (r'var\s+ProjectData\s*=\s*(\{.*?\});','PROJECT_DATA')]:
            m=re.search(pat,page,re.S)
            if m: print(label,m.group(1)[:20000])
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I):
            u=html.unescape(m.group(1));
            if u.startswith('//'): u='https:'+u
            elif u.startswith('/'): u=base+u
            elif not u.startswith('http'): u=urllib.parse.urljoin(record,u)
            scripts.append(u)
          print('SCRIPT_COUNT',len(scripts))
          for u in scripts: print('SCRIPT',u)
          needles=['freeAccessAlertReadLink','freeAccessAlert','readLink','viewer','Просмотрщик','freeAccess']
          for u in scripts:
            try: js=get(u)
            except Exception as e: print('SCRIPT_ERROR',u,repr(e)); continue
            if any(n.lower() in js.lower() for n in needles):
              print('\n=== MATCHING SCRIPT',u,'===')
              for n in needles:
                for m in re.finditer(re.escape(n),js,re.I):
                  a=max(0,m.start()-2500); b=min(len(js),m.end()+5000)
                  print('NEEDLE',n,js[a:b])
          PY
