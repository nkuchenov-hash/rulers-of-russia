name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  resolve-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect request helper and route document-id normalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re
          base='https://viewer.rsl.ru'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            return urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
          app=get(base+'/js/app.a6574da3.js')
          for needle in ['"9b0f":function','fetchDocumentInfo"','fetchDocumentInfo,','dispatch("fetchDocumentInfo"','dispatch(\'fetchDocumentInfo\'','route.params','docId','documentId']:
            print('\n### NEEDLE',needle)
            for m in list(re.finditer(re.escape(needle),app,re.I))[:20]:
              print(app[max(0,m.start()-5000):min(len(app),m.end()+10000)])
          # Try exact endpoint with common normalization/slash/header variants, logging bodies on errors.
          import urllib.error
          ids=['rsl01009649842','01009649842','rsl01009649842?','rsl01009649842/']
          for d in ids:
            u=f'{base}/api/v1/document/{d}/info'
            for headers in [
              {'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','Referer':base+'/ru/rsl01009649842?page=1'},
              {'User-Agent':'Mozilla/5.0','Accept':'application/json,text/plain,*/*','X-Requested-With':'XMLHttpRequest','Referer':base+'/ru/rsl01009649842?page=1'},
            ]:
              req=urllib.request.Request(u,headers=headers)
              try:
                with urllib.request.urlopen(req,timeout=60) as r: print('OK',u,r.status,r.geturl(),r.read()[:30000])
              except urllib.error.HTTPError as e: print('HTTP',u,e.code,e.read()[:5000])
              except Exception as e: print('ERR',u,repr(e))
          PY
