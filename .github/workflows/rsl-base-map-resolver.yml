name: Resolve USSR 1927 historical base map
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  inspect-open-raster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download open 1927 map reproduction and inspect graticule
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick tesseract-ocr tesseract-ocr-rus python3-opencv file >/dev/null
          mkdir -p /tmp/ussr1927
          URL='https://img-fotki.yandex.ru/get/896238/178262777.47/0_176c01_6af00f50_orig.jpg'
          for referer in 'https://life-styling.ru/' 'https://yandex.ru/' ''; do
            echo "TRY referer=$referer"
            if curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
              -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36' \
              ${referer:+-e "$referer"} "$URL" -o /tmp/ussr1927/map.jpg; then
              break
            fi
          done
          file /tmp/ussr1927/map.jpg
          identify /tmp/ussr1927/map.jpg
          ls -lh /tmp/ussr1927/map.jpg
          echo '=== OCR WHOLE MAP ==='
          tesseract /tmp/ussr1927/map.jpg stdout -l rus+eng --psm 11 2>/dev/null | head -n 300 || true
          python - <<'PY'
          import cv2, numpy as np
          img=cv2.imread('/tmp/ussr1927/map.jpg')
          if img is None: raise SystemExit('image decode failed')
          h,w=img.shape[:2]
          print('IMAGE_SHAPE',w,h)
          # Make review preview.
          scale=min(1.0,2000/w)
          prev=cv2.resize(img,(round(w*scale),round(h*scale)),interpolation=cv2.INTER_AREA)
          cv2.imwrite('/tmp/ussr1927/preview.jpg',prev,[int(cv2.IMWRITE_JPEG_QUALITY),92])
          # Detect strong red/magenta political boundary ink independently from yellow fills.
          hsv=cv2.cvtColor(img,cv2.COLOR_BGR2HSV)
          m1=cv2.inRange(hsv,np.array([0,95,70]),np.array([12,255,255]))
          m2=cv2.inRange(hsv,np.array([170,95,70]),np.array([179,255,255]))
          red=cv2.bitwise_or(m1,m2)
          # Remove tiny isolated pixels and preserve lines.
          red=cv2.morphologyEx(red,cv2.MORPH_OPEN,np.ones((2,2),np.uint8))
          cv2.imwrite('/tmp/ussr1927/red-mask.png',red)
          overlay=img.copy(); overlay[red>0]=(0,0,255)
          overlay=cv2.resize(overlay,(round(w*scale),round(h*scale)),interpolation=cv2.INTER_AREA)
          cv2.imwrite('/tmp/ussr1927/red-overlay.jpg',overlay,[int(cv2.IMWRITE_JPEG_QUALITY),92])
          n,labels,stats,cents=cv2.connectedComponentsWithStats(red,8)
          comps=[]
          for i in range(1,n):
            x,y,cw,ch,area=stats[i]
            if area>=20: comps.append((int(area),int(x),int(y),int(cw),int(ch)))
          comps.sort(reverse=True)
          print('RED_COMPONENTS_TOP',comps[:100])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ussr-1927-open-raster-diagnostics
          path: |
            /tmp/ussr1927/preview.jpg
            /tmp/ussr1927/red-overlay.jpg
            /tmp/ussr1927/red-mask.png
          if-no-files-found: ignore
          retention-days: 7
