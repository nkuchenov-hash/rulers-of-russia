name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  inspect-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect explicit viewer bundles for document APIs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re
          base='https://viewer.rsl.ru'
          assets=[
            base+'/js/app.a6574da3.js',
            base+'/js/chunk-vendors.bcbb31f1.js',
            base+'/js/pdfModule.2b47014e.js',
          ]
          def raw(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=90) as r: return r.read()
          needles=['/api/','api.','tile','image','document','pages','manifest','iiif','bookId','book_id','resource','download','rsl010']
          for u in assets:
            try: js=raw(u).decode('utf-8','replace')
            except Exception as e: print('ERR',u,repr(e)); continue
            print('\n===',u,'BYTES',len(js),'===')
            strings=set(re.findall(r'["\']([^"\']{3,500})["\']',js))
            for s in sorted(strings):
              low=s.lower()
              if any(k in low for k in ['/api/','tile','manifest','iiif','image','document','page','book','resource','download']):
                print('STR',s[:500])
            for n in ['/api/','manifest','iiif','tile','download']:
              for m in list(re.finditer(re.escape(n),js,re.I))[:40]:
                print('CTX',n,js[max(0,m.start()-1200):min(len(js),m.end()+2400)])
          PY
