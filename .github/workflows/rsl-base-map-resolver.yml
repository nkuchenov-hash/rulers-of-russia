name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  ajax-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect the AJAX record access/read block
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html
          url='https://search.rsl.ru/ru/record?id=01009649842'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest','Referer':'https://search.rsl.ru/ru/record/01009649842'})
          page=urllib.request.urlopen(req,timeout=90).read().decode('utf-8','replace')
          print('LEN',len(page))
          for needle in ['Документ в свободном доступе','Читать','viewer','fullDocument','hasFile','data-read','freeAccess','rsl01009649842','href=']:
            print('\n===',needle,'===')
            hits=list(re.finditer(re.escape(needle),page,re.I))
            print('COUNT',len(hits))
            for m in hits[:50]: print(page[max(0,m.start()-3000):min(len(page),m.end()+7000)])
          print('\n=== LINKS ===')
          for m in re.finditer(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*>(.*?)</a>',page,re.I|re.S):
            href=html.unescape(m.group(1)); text=' '.join(re.sub('<[^>]+>',' ',m.group(2)).split())
            print(text,'=>',href)
          PY
