name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  probe-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the public viewer and enumerate image endpoints
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,urllib.parse
          urls=[
            'https://viewer.rsl.ru/ru/rsl01009649842?page=1&rotate=0&theme=white',
            'https://viewer.rsl.ru/ru/rsl01009649842',
          ]
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
            with urllib.request.urlopen(req,timeout=90) as r:
              return r.geturl(), r.read().decode('utf-8','replace')
          page=''; final=''
          for u in urls:
            try:
              final,page=get(u); print('VIEWER_OK',u,'=>',final,'BYTES',len(page)); break
            except Exception as e: print('VIEWER_ERROR',u,repr(e))
          if not page: raise SystemExit('viewer unavailable')
          for line in page.splitlines():
            low=line.lower()
            if any(k in low for k in ['tile','image','page','manifest','iiif','book','rsl01009649842','zoom','source']):
              print('HTML',line[:5000])
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I):
            u=html.unescape(m.group(1))
            if u.startswith('//'): u='https:'+u
            elif u.startswith('/'): u=urllib.parse.urljoin(final,u)
            elif not u.startswith('http'): u=urllib.parse.urljoin(final,u)
            scripts.append(u)
          print('SCRIPTS',len(scripts))
          for u in scripts:
            print('SCRIPT',u)
            try: _,js=get(u)
            except Exception as e: print('ERR',repr(e)); continue
            if any(k in js.lower() for k in ['tile','manifest','iiif','imageurl','pageurl','rsl01009649842']):
              for m in re.finditer(r'.{0,1000}(?:tile|manifest|iiif|imageUrl|pageUrl|rsl01009649842).{0,2500}',js,re.I|re.S):
                print('JS_MATCH',m.group(0)[:5000])
          PY
