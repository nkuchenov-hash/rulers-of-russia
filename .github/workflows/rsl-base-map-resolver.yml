name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  resolve-read-url:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract free-access read URL and test viewer API in one session
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,urllib.parse,re,html,http.cookiejar,json
          record='https://search.rsl.ru/ru/record/01009649842'
          jar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          headers={'User-Agent':'Mozilla/5.0','Accept':'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'}
          req=urllib.request.Request(record,headers=headers)
          with opener.open(req,timeout=90) as r: page=r.read().decode('utf-8','replace')
          tags=[]
          for m in re.finditer(r'<[^>]*class=["\'][^"\']*js-free-access-alert[^"\']*["\'][^>]*>',page,re.I):
            tag=m.group(0); tags.append(tag); print('ACCESS_TAG',tag[:10000])
          print('ACCESS_TAG_COUNT',len(tags))
          read_urls=[]
          for tag in tags:
            mm=re.search(r'data-read-url=["\']([^"\']+)["\']',tag,re.I)
            if mm:
              u=html.unescape(mm.group(1))
              u=urllib.parse.urljoin(record,u)
              read_urls.append(u); print('READ_URL',u)
          print('COOKIES_AFTER_RECORD',[(c.domain,c.name,c.value) for c in jar])
          for u in read_urls:
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':record})
            try:
              with opener.open(req,timeout=90) as r:
                b=r.read(); print('READ_OK',u,'=>',r.geturl(),'CTYPE',r.headers.get('Content-Type'),'LEN',len(b)); print('READ_HEAD',b[:1000])
            except Exception as e: print('READ_ERR',u,repr(e))
          # Re-test direct viewer endpoints after the search-site session has been established.
          for endpoint in ['page/1','pdf','info']:
            u=f'https://viewer.rsl.ru/api/v1/document/rsl01009649842/{endpoint}'
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0','Referer':read_urls[0] if read_urls else record,'Accept':'*/*'})
            try:
              with opener.open(req,timeout=90) as r:
                b=r.read(); print('API_OK',endpoint,r.status,r.geturl(),r.headers.get('Content-Type'),len(b),b[:300])
            except urllib.error.HTTPError as e: print('API_HTTP',endpoint,e.code,e.read()[:3000])
            except Exception as e: print('API_ERR',endpoint,repr(e))
          PY
