name: Resolve RSL historical base maps
on:
  push:
    branches: [research/rsl-ussr-base-maps]
permissions:
  contents: read
jobs:
  trace-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trace free-access online reader bootstrap across RSL scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,re,html,urllib.parse
          record='https://search.rsl.ru/ru/record/01009649842'
          base='https://search.rsl.ru'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':record})
            with urllib.request.urlopen(req,timeout=90) as r: return r.geturl(),r.read().decode('utf-8','replace')
          _,page=get(record)
          scripts=[]
          for m in re.finditer(r'<script[^>]+src=["\']([^"\']+)["\']',page,re.I):
            u=html.unescape(m.group(1))
            if u.startswith('//'): u='https:'+u
            elif u.startswith('/'): u=base+u
            elif not u.startswith('http'): u=urllib.parse.urljoin(record,u)
            if 'search.rsl.ru' in u and u not in scripts: scripts.append(u)
          print('SCRIPTS',len(scripts))
          needles=['freeAccessAlertReadLink','freeAccessAlert','viewer.rsl.ru','viewer.rusneb.ru','Читать онлайн','freeAccess','readLink','fullDocumentId','hasFile','access_label','open-access']
          for u in scripts:
            try: _,js=get(u)
            except Exception as e: print('SCRIPT_ERR',u,repr(e)); continue
            matches=[]
            for n in needles:
              for m in re.finditer(re.escape(n),js,re.I): matches.append((m.start(),n))
            if not matches: continue
            print('\n=== SCRIPT',u,'BYTES',len(js),'===')
            for pos,n in sorted(matches)[:80]:
              print('\nNEEDLE',n,'AT',pos)
              print(js[max(0,pos-3500):min(len(js),pos+8000)])
            print('\nURL/PATH LITERALS')
            for s in sorted(set(re.findall(r'["\']([^"\']{2,600})["\']',js))):
              low=s.lower()
              if any(k in low for k in ['viewer','access','online','document','file','read','fulltext','ebook','resource']): print(s[:600])
          PY
