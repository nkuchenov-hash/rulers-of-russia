name: USSR 1924 1939 corrected controls
on:
  pull_request:
    paths:
      - scripts/analyze-ussr-1924-1939.mjs
      - .github/workflows/ussr-1924-1939-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-ussr-1924-1939.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-1924-1939-corrected-controls
          path: ussr-1924-1939-corrected-controls.json
