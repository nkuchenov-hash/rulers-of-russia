name: Apply territory V28 close control and year navigation

on:
  push:
    branches:
      - territory-v28-close-control-year-navigation
      - main
    paths:
      - .github/workflows/apply-territory-v28.yml
      - scripts/apply-territory-v28.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Detect materialized V28
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'adaptiveControlSpeed(controls,d)' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx \
             && grep -q 'TERRITORY_PERIODS.map' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx \
             && grep -q 'eraJump' src/app/territory/territory-webgl.module.css; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply V28 patch
        if: steps.state.outputs.ready != 'true'
        run: python scripts/apply-territory-v28.py

      - name: Verify V28 interaction rules
        if: steps.state.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'idx.push(a,b,c,b,d,c)' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          grep -q 'depthWrite:false,depthTest:true,side:THREE.DoubleSide' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          grep -q 'adaptiveControlSpeed(controls,d)' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          grep -q "scrollToYear(current+(raw>0?1:-1),'auto')" src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          grep -q 'TERRITORY_PERIODS.map' src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx
          grep -q 'eraJump' src/app/territory/territory-webgl.module.css

      - name: Commit materialized V28
        if: steps.state.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/territory/HistoricalTerritoryGlobeWebGLV21.jsx src/app/territory/territory-webgl.module.css
          if git diff --cached --quiet; then
            echo 'Nothing to commit.'
            exit 0
          fi
          git commit -m 'Fix close globe artifacts and year navigation'
          git push origin "HEAD:${GITHUB_REF_NAME}"
