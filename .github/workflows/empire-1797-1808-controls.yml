name: Empire 1797 1808 controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1797-1808.mjs
      - .github/workflows/empire-1797-1808-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1797-1808.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1797-1808-controls
          path: empire-1797-1808-controls.json
