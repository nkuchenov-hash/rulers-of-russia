name: Empire 1830 1884 corrected controls
on:
  pull_request:
    paths:
      - scripts/analyze-empire-1830-1884-corrected.mjs
      - .github/workflows/empire-1830-1884-corrected.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-empire-1830-1884-corrected.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: empire-1830-1884-corrected-controls
          path: empire-1830-1884-corrected-controls.json
