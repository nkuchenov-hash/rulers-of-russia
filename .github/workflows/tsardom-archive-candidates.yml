name: Tsardom archive candidate research

on:
  pull_request:
    paths:
      - scripts/analyze-tsardom-archive-candidates.mjs
      - public/data/territory/archive/russian-tsardom.geojson
      - .github/workflows/tsardom-archive-candidates.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate archived Tsardom vector states
        run: node scripts/analyze-tsardom-archive-candidates.mjs
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: tsardom-archive-candidates
          path: tsardom-archive-candidates.json
