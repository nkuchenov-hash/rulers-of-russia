name: Inspect early Rus 862 source map
on:
  push:
    branches: [history/early-rus-862-base]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and inspect Tornau 1910 map
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-opencv python3-pil tesseract-ocr tesseract-ocr-rus >/dev/null
          mkdir -p /tmp/early-rus-862
          curl -fL --retry 3 --connect-timeout 20 --max-time 180 \
            'https://upload.wikimedia.org/wikipedia/commons/8/8d/Historical_map_of_Rus%27%2C_862.gif' \
            -o /tmp/early-rus-862/source.gif
          sha256sum /tmp/early-rus-862/source.gif | tee /tmp/early-rus-862/sha256.txt
          python - <<'PY'
          from PIL import Image
          import cv2,numpy as np,json
          src='/tmp/early-rus-862/source.gif'
          im=Image.open(src).convert('RGB')
          print('IMAGE_SIZE',im.size)
          im.save('/tmp/early-rus-862/source.png')
          preview=im.copy(); preview.thumbnail((1200,1200)); preview.save('/tmp/early-rus-862/preview.jpg',quality=92)
          arr=np.array(im)
          gray=cv2.cvtColor(arr,cv2.COLOR_RGB2GRAY)
          edges=cv2.Canny(gray,70,160)
          cv2.imwrite('/tmp/early-rus-862/edges.png',edges)
          lines=cv2.HoughLinesP(edges,1,np.pi/180,threshold=150,minLineLength=180,maxLineGap=15)
          found=[]
          if lines is not None:
            for line in lines[:500]:
              x1,y1,x2,y2=map(int,line[0]);
              angle=float(np.degrees(np.arctan2(y2-y1,x2-x1)))
              found.append({'p1':[x1,y1],'p2':[x2,y2],'angle':round(angle,3),'length':round(float(np.hypot(x2-x1,y2-y1)),2)})
          with open('/tmp/early-rus-862/hough-lines.json','w') as f: json.dump(found,f,indent=2)
          print('HOUGH_LINES',len(found))

          # Bottom-left panel is the atlas' "Русь с 862–1054 г." chronological acquisition map.
          # Preserve original-image pixel coordinates for later raster recipes.
          x0,y0,x1,y1=70,1390,965,2145
          crop=arr[y0:y1,x0:x1]
          cv2.imwrite('/tmp/early-rus-862/rus-862-1054-panel.png',cv2.cvtColor(crop,cv2.COLOR_RGB2BGR))
          with open('/tmp/early-rus-862/panel-bounds.json','w') as f: json.dump({'sourcePixelBounds':[x0,y0,x1,y1],'width':x1-x0,'height':y1-y0},f,indent=2)

          # Color clustering is diagnostic only; it helps isolate the legend's earliest Rurik layer.
          small=cv2.resize(crop,None,fx=.5,fy=.5,interpolation=cv2.INTER_AREA)
          data=small.reshape((-1,3)).astype(np.float32)
          criteria=(cv2.TERM_CRITERIA_EPS+cv2.TERM_CRITERIA_MAX_ITER,50,.3)
          compact,labels,centers=cv2.kmeans(data,10,None,criteria,8,cv2.KMEANS_PP_CENTERS)
          centers=np.uint8(centers)
          counts=np.bincount(labels.ravel(),minlength=len(centers))
          order=np.argsort(-counts)
          clusters=[]
          for rank,idx in enumerate(order):
            clusters.append({'rank':rank,'cluster':int(idx),'rgb':centers[idx].tolist(),'pixels':int(counts[idx])})
            mask=(labels.reshape(small.shape[:2])==idx).astype(np.uint8)*255
            cv2.imwrite(f'/tmp/early-rus-862/panel-cluster-{rank:02d}.png',mask)
          with open('/tmp/early-rus-862/panel-color-clusters.json','w') as f: json.dump(clusters,f,indent=2)
          print('PANEL_BOUNDS',x0,y0,x1,y1)
          print('COLOR_CLUSTERS',json.dumps(clusters))
          PY
          tesseract /tmp/early-rus-862/source.png /tmp/early-rus-862/ocr -l rus+eng --psm 11 tsv >/dev/null 2>&1 || true
          tesseract /tmp/early-rus-862/rus-862-1054-panel.png /tmp/early-rus-862/panel-ocr -l rus+eng --psm 11 tsv >/dev/null 2>&1 || true
          python - <<'PY'
          import csv,json,re
          def rows(path):
            out=[]
            try:
              with open(path,encoding='utf8') as f:
                for r in csv.DictReader(f,delimiter='\t'):
                  text=(r.get('text') or '').strip()
                  if not text: continue
                  try: conf=float(r.get('conf') or -1)
                  except: conf=-1
                  if conf>=20: out.append({'text':text,'confidence':conf,'x':int(r['left']),'y':int(r['top']),'w':int(r['width']),'h':int(r['height'])})
            except FileNotFoundError: pass
            return out
          full=rows('/tmp/early-rus-862/ocr.tsv'); panel=rows('/tmp/early-rus-862/panel-ocr.tsv')
          with open('/tmp/early-rus-862/ocr.json','w') as f: json.dump(full,f,ensure_ascii=False,indent=2)
          with open('/tmp/early-rus-862/panel-ocr.json','w') as f: json.dump(panel,f,ensure_ascii=False,indent=2)
          print('OCR_ROWS',len(full),'PANEL_OCR_ROWS',len(panel))
          print('PANEL_COORD_OR_LEGEND_CANDIDATES')
          for r in panel:
            if re.search(r'\d{1,4}',r['text']) or any(k in r['text'].lower() for k in ['рюрик','влад','олег','приобр','масштаб','русь']): print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: early-rus-862-map-diagnostics
          path: |
            /tmp/early-rus-862/preview.jpg
            /tmp/early-rus-862/edges.png
            /tmp/early-rus-862/sha256.txt
            /tmp/early-rus-862/hough-lines.json
            /tmp/early-rus-862/ocr.json
            /tmp/early-rus-862/rus-862-1054-panel.png
            /tmp/early-rus-862/panel-bounds.json
            /tmp/early-rus-862/panel-color-clusters.json
            /tmp/early-rus-862/panel-cluster-*.png
            /tmp/early-rus-862/panel-ocr.json
          retention-days: 7
