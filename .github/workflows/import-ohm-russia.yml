name: Import OHM Russia territory snapshots

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/import-ohm-russia.mjs
      - .github/workflows/import-ohm-russia.yml
      - package.json
  pull_request:
    branches:
      - main
    paths:
      - scripts/import-ohm-russia.mjs
      - .github/workflows/import-ohm-russia.yml
      - package.json

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Import historical Russia polygons from OHM
        run: npm run import:ohm:russia

      - name: Show import manifest
        run: cat public/data/territory/ohm/manifest.json

      - name: Upload imported territory cache
        uses: actions/upload-artifact@v4
        with:
          name: ohm-russia-territory-cache
          path: public/data/territory/ohm
          if-no-files-found: error

      - name: Commit imported snapshot cache
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/territory/ohm
          if git diff --cached --quiet; then
            echo "No imported data changes"
          else
            git commit -m "Cache OHM historical Russia territory data"
            git push origin HEAD:main
          fi
