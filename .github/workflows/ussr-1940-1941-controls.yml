name: USSR 1940 1941 controls
on:
  pull_request:
    paths:
      - scripts/analyze-ussr-1940-1941.mjs
      - .github/workflows/ussr-1940-1941-controls.yml
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/analyze-ussr-1940-1941.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ussr-1940-1941-controls
          path: ussr-1940-1941-controls.json
